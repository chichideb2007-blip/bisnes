<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .checkout-card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        .form-label { font-weight: bold; color: #333; }
        .price-box { background: #e9ecef; padding: 15px; border-radius: 10px; margin: 20px 0; text-align: center; }
        .btn-confirm { background-color: #198754; color: white; padding: 12px; font-weight: bold; border: none; border-radius: 8px; flex-grow: 1; }
        .btn-back { background-color: #6c757d; color: white; padding: 12px; font-weight: bold; border: none; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container mt-4">
    <div class="checkout-card">
        <h3 class="text-center mb-4">معلومات الطلب</h3>
        
        <form action="/submit-order" method="POST">
            <!-- المدخلات المخفية -->
            <input type="hidden" name="product_id" value="{{ product.id }}">
            <input type="hidden" id="base_price" value="{{ product.price }}">
            <input type="hidden" id="company_code" value="{{ product.company_id_text }}">

            <!-- الاسم واللقب -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">الاسم</label>
                    <input type="text" name="customer_name" class="form-control" required placeholder="الاسم">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">اللقب</label>
                    <input type="text" name="customer_last_name" class="form-control" required placeholder="اللقب">
                </div>
            </div>

            <!-- الهاتف والكمية -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">رقم الهاتف</label>
                    <input type="tel" name="phone" class="form-control" required placeholder="0XXXXXXXXX">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">الكمية</label>
                    <input type="number" name="quantity" id="quantity" class="form-control" value="1" min="1" onchange="calculateOrder()" required>
                </div>
            </div>

            <!-- الولاية والبلدية -->
            <div class="mb-3">
                <label class="form-label">الولاية</label>
                <select id="wilaya" name="wilaya" class="form-select" onchange="calculateOrder()" required>
                    <option value="">-- اختر الولاية --</option>
                    {% for wilaya in wilayas %}
                        <option value="{{ wilaya.id }}">{{ wilaya.wilaya_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">البلدية</label>
                <input type="text" id="baladia" name="baladia" class="form-control" placeholder="أدخل اسم البلدية" required>
            </div>

            <div class="mb-3">
                <label class="form-label">العنوان الكامل</label>
                <input type="text" name="address" class="form-control" placeholder="أدخل العنوان بالتفصيل" required>
            </div>

            <!-- التوصيل -->
            <div class="mb-3">
                <label class="form-label">طريقة التوصيل</label>
                <select id="delivery_type" name="delivery_type" class="form-select" onchange="calculateOrder()" required>
                    <option value="home">توصيل للمنزل</option>
                    <option value="office">توصيل للمكتب</option>
                </select>
            </div>

            <!-- عرض الأسعار -->
            <div class="price-box">
                <h4>سعر التوصيل: <span id="shipping_display">0</span> دج</h4>
                <h4 class="text-primary mt-2">المجموع النهائي: <span id="total_display">{{ product.price }}</span> دج</h4>
            </div>

            <!-- الأزرار -->
            <div class="d-flex gap-2">
                <button type="submit" class="btn-confirm">تأكيد الطلب</button>
                <a href="/shop" class="btn-back">رجوع</a>
            </div>
        </form>
    </div>
</div>

<script>
    // جلب قائمة الولايات
    const wilayas = {{ wilayas | tojson }};

    function calculateOrder() {
        const wilayaSelect = document.getElementById('wilaya');
        const deliveryType = document.getElementById('delivery_type').value;
        const qty = parseInt(document.getElementById('quantity').value) || 1;
        const basePrice = parseFloat(document.getElementById('base_price').value) || 0;
        
        const shippingDisplay = document.getElementById('shipping_display');
        const totalDisplay = document.getElementById('total_display');

        const selectedWilaya = wilayas.find(w => w.id == wilayaSelect.value);
        
        if (selectedWilaya) {
            const shippingPrice = (deliveryType === 'home') ? parseFloat(selectedWilaya.home_price) : parseFloat(selectedWilaya.office_price);
            
            shippingDisplay.innerText = shippingPrice; 
            const total = (basePrice * qty) + shippingPrice;
            totalDisplay.innerText = total;
        } else {
            shippingDisplay.innerText = "0";
            totalDisplay.innerText = basePrice * qty;
        }
    }

    // تحديث الصفحة كل 30 ثانية
    setInterval(function(){
        location.reload();
    }, 30000);
</script>

</body>
</html>
