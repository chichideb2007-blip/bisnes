<form action="/submit-order" method="POST" class="p-3 border rounded">
    <input type="hidden" name="product_id" value="{{ product.id }}">
    <input type="hidden" id="base_price" value="{{ product.price }}">
    <input type="hidden" id="company_code" value="{{ product.company_id_text }}">

    <div class="mb-3">
        <input type="text" name="customer_name" placeholder="الاسم" required class="form-control mb-2">
        <input type="text" name="customer_last_name" placeholder="اللقب" required class="form-control mb-2">
        <input type="text" name="phone" placeholder="رقم الهاتف" required class="form-control mb-2">
    </div>

    <!-- خانة الكمية -->
    <div class="mb-3">
        <label>الكمية:</label>
        <input type="number" name="quantity" id="quantity" value="1" min="1" onchange="calculateOrder()" class="form-control">
    </div>

    <div class="mb-3">
        <label>اختر الولاية:</label>
        <select id="wilaya" name="wilaya" onchange="calculateOrder()" class="form-control mb-2" required>
            <option value="">-- اختر الولاية --</option>
            {% for wilaya in wilayas %}
                <option value="{{ wilaya.id }}">{{ wilaya.wilaya_name }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- خانة البلدية المضافة -->
    <div class="mb-3 form-group">
        <label for="baladia">البلدية:</label>
        <input type="text" id="baladia" name="baladia" class="form-control" placeholder="أدخل اسم البلدية" required>
    </div>

    <div class="mb-3">
        <label>طريقة التوصيل:</label>
        <select id="delivery_type" name="delivery_type" onchange="calculateOrder()" class="form-control mb-2" required>
            <option value="home">توصيل للمنزل</option>
            <option value="office">توصيل للمكتب</option>
        </select>
    </div>

    <!-- مكان عرض السعر النهائي -->
    <div class="card p-3 bg-light">
        <h4>سعر التوصيل: <span id="shipping_display">0</span> دج</h4>
        <h4 class="text-primary">المجموع النهائي: <span id="total_display">{{ product.price }}</span> دج</h4>
    </div>
    
    <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-success flex-grow-1">تأكيد الطلب</button>
        <a href="/shop" class="btn btn-secondary">رجوع</a>
    </div>
</form>

<script>
    // جلب قائمة الولايات من Flask مباشرة
    const wilayas = {{ wilayas | tojson }}; 

    function calculateOrder() {
        // 1. جلب القيم من النموذج
        const wilayaSelect = document.getElementById('wilaya');
        const deliveryType = document.getElementById('delivery_type').value;
        const qty = parseInt(document.getElementById('quantity').value) || 1;
        const basePrice = parseFloat(document.getElementById('base_price').value) || 0;
        
        const shippingDisplay = document.getElementById('shipping_display');
        const totalDisplay = document.getElementById('total_display');

        // البحث عن الولاية المختارة في مصفوفة الولايات
        const selectedWilaya = wilayas.find(w => w.id == wilayaSelect.value);
        
        if (selectedWilaya) {
            // 2. تحديد السعر بناءً على النوع (home_price أو office_price)
            const shippingPrice = (deliveryType === 'home') ? parseFloat(selectedWilaya.home_price) : parseFloat(selectedWilaya.office_price);
            
            // 3. تحديث خانة سعر التوصيل
            shippingDisplay.innerText = shippingPrice; 
            
            // 4. حساب المجموع الكلي وتحديثه
            const total = (basePrice * qty) + shippingPrice;
            totalDisplay.innerText = total;
        } else {
            // في حال عدم اختيار ولاية
            shippingDisplay.innerText = "0";
            totalDisplay.innerText = basePrice * qty;
        }
    }

    // تحديث الصفحة كل 30 ثانية لتظهر تغييرات تيلجرام
    setInterval(function(){
        location.reload();
    }, 30000);
</script>
