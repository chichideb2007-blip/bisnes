<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .checkout-card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        .form-label { font-weight: bold; color: #333; }
        .price-box { background: #e9ecef; padding: 15px; border-radius: 10px; margin: 20px 0; }
        .btn-confirm { background-color: #198754; color: white; padding: 12px; font-weight: bold; border: none; border-radius: 8px; flex-grow: 1; }
        .btn-back { background-color: #6c757d; color: white; padding: 12px; font-weight: bold; border: none; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container mt-4">
    <div class="checkout-card">
        <h3 class="text-center mb-4">معلومات الطلب</h3>
        
        <div id="cart-items" class="mb-3">
            <h6 class="text-muted">المنتجات المختارة:</h6>
        </div>

        <form action="/submit-order" method="POST" id="orderForm">
            <input type="hidden" name="cart_data" id="cart_data">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">الاسم</label>
                    <input type="text" name="customer_name" class="form-control" required placeholder="الاسم">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">اللقب</label>
                    <input type="text" name="customer_last_name" class="form-control" required placeholder="اللقب">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">رقم الهاتف</label>
                <input type="tel" name="phone" class="form-control" required placeholder="0XXXXXXXXX">
            </div>

            <div class="mb-3">
                <label class="form-label">الولاية</label>
                <select id="wilaya" name="wilaya" class="form-select" onchange="calculateOrder()" required>
                    <option value="">-- اختر الولاية --</option>
                    {% for wilaya in wilayas %}
                        <option value="{{ wilaya.id }}" 
                                data-home="{{ wilaya.home_price }}" 
                                data-office="{{ wilaya.office_price }}">
                            {{ wilaya.wilaya_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">البلدية</label>
                <input type="text" id="baladia" name="baladia" class="form-control" placeholder="أدخل اسم البلدية" required>
            </div>

            <div class="mb-3">
                <label class="form-label">العنوان الكامل</label>
                <input type="text" name="address" class="form-control" placeholder="أدخل العنوان بالتفصيل" required>
            </div>

            <div class="mb-3">
                <label class="form-label">طريقة التوصيل</label>
                <select id="delivery_type" name="delivery_type" class="form-select" onchange="calculateOrder()" required>
                    <option value="home">توصيل للمنزل</option>
                    <option value="office">توصيل للمكتب</option>
                </select>
            </div>

            <div class="price-box">
                <h5>سعر التوصيل: <span id="shipping_display">0</span> دج</h5>
                <h4 class="text-primary mt-2">المجموع الكلي: <span id="total_display">0</span> دج</h4>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn-confirm">تأكيد الطلب</button>
                <a href="/shop" class="btn-back">رجوع</a>
            </div>
        </form>
    </div>
</div>

<script>
    // 1. قراءة السلة من المتصفح
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    let cartContainer = document.getElementById('cart-items');
    let basePrice = 0;

    // عرض المنتجات في جدول بسيط
    cart.forEach(item => {
        basePrice += parseFloat(item.price);
        cartContainer.innerHTML += `
            <div class="d-flex justify-content-between border-bottom p-2">
                <span>${item.name}</span>
                <span class="fw-bold">${item.price} دج</span>
            </div>
        `;
    });

    // 2. تحديث المجموع عند اختيار الولاية
    function calculateOrder() {
        const wilayaSelect = document.getElementById('wilaya');
        const deliveryType = document.getElementById('delivery_type').value;
        const selectedOption = wilayaSelect.options[wilayaSelect.selectedIndex];
        
        let shippingPrice = 0;
        if (selectedOption.value !== "") {
            shippingPrice = (deliveryType === 'home') ? parseFloat(selectedOption.dataset.home) : parseFloat(selectedOption.dataset.office);
        }
        
        document.getElementById('shipping_display').innerText = shippingPrice;
        document.getElementById('total_display').innerText = (basePrice + shippingPrice) + ' دج';
    }

    // 3. عند الضغط على تأكيد الطلب، نضع بيانات السلة في الحقل المخفي
    document.getElementById('orderForm').onsubmit = function() {
        document.getElementById('cart_data').value = JSON.stringify(cart);
        // اختياري: مسح السلة بعد الطلب
        // localStorage.removeItem('cart');
    };
    
    // تشغيل الحساب لأول مرة
    calculateOrder();
</script>

</body>
</html>
