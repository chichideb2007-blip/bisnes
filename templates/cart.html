<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <header class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-100 py-4 px-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-black text-gray-900">🛒 سلة المشتريات</h1>
            <a href="/shop" class="text-sm font-bold text-indigo-600 bg-indigo-50 px-4 py-2 rounded-full">العودة للمتجر</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        <div id="cart-items-container" class="space-y-4 mb-6"></div>

        <div id="cart-summary" class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 hidden">
            <div class="flex justify-between items-center mb-4">
                <span class="text-gray-500 font-bold">المجموع الكلي:</span>
                <span class="text-2xl font-black text-indigo-600"><span id="total-price">0</span> دج</span>
            </div>
            <button onclick="proceedToCheckout()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl shadow-lg transition-all">
                🚚 تأكيد الطلب وإدخال معلومات التوصيل
            </button>
        </div>

        <div id="empty-cart-msg" class="text-center py-16 bg-white rounded-3xl shadow-sm border border-gray-100 hidden">
            <h3 class="text-lg font-bold text-gray-800 mb-2">سلة المشتريات فارغة حالياً</h3>
            <a href="/shop" class="bg-indigo-600 text-white font-bold px-6 py-2.5 rounded-xl text-sm inline-block">تصفح المنتجات</a>
        </div>
    </main>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let container = document.getElementById('cart-items-container');
            let summary = document.getElementById('cart-summary');
            let emptyMsg = document.getElementById('empty-cart-msg');
            
            container.innerHTML = '';

            if (cart.length === 0) {
                emptyMsg.classList.remove('hidden');
                summary.classList.add('hidden');
                return;
            }

            emptyMsg.classList.add('hidden');
            summary.classList.remove('hidden');

            let total = 0;
            cart.forEach((item, index) => {
                let itemPrice = parseFloat(item.price) || 0;
                let itemQty = parseInt(item.quantity) || 1;
                let itemTotal = itemPrice * itemQty;
                total += itemTotal;

                let imgSrc = item['product-images'] || 'https://via.placeholder.com/80';

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between gap-4">
                        <div class="flex items-center gap-4">
                            <img src="${imgSrc}" style="width: 70px; height: 70px; object-fit: cover;" class="rounded-xl border">
                            <div>
                                <h3 class="font-bold text-gray-800">${item.name}</h3>
                                <p class="text-indigo-600 font-black text-sm">${itemPrice} دج</p>
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-4">
                            <div class="flex items-center border rounded-xl overflow-hidden bg-gray-50">
                                <button onclick="changeQuantity(${index}, -1)" class="px-3 py-1 font-bold">-</button>
                                <span class="px-3 font-bold">${itemQty}</span>
                                <button onclick="changeQuantity(${index}, 1)" class="px-3 py-1 font-bold">+</button>
                            </div>
                            <span class="font-black text-gray-900">${itemTotal} دج</span>
                            <button onclick="removeItem(${index})" class="text-rose-500 p-2"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('total-price').innerText = total;
        }

        function changeQuantity(index, delta) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart[index]) {
                cart[index].quantity = (parseInt(cart[index].quantity) || 1) + delta;
                if (cart[index].quantity < 1) cart[index].quantity = 1;
                localStorage.setItem('cart', JSON.stringify(cart));
                loadCart();
            }
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }

        function proceedToCheckout() {
            window.location.href = "/checkout_cart";
        }

        loadCart();
    </script>
</body>
</html>
