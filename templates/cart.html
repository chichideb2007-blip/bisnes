<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سلة المشتريات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 600px;">
        <h2 class="mb-4 text-center">🛒 سلة المشتريات</h2>
        
        <div id="cart-items-container">
            <!-- سيتم تعبئة المنتجات هنا تلقائياً بواسطة الجافاسكريبت -->
        </div>

        <div id="cart-summary" class="card p-3 mt-3 shadow-sm d-none">
            <h4>المجموع الكلي للمنتجات: <span id="total-price">0</span> دج</h4>
            <button onclick="proceedToCheckout()" class="btn btn-success w-100 mt-3 py-2 fw-bold">
                🚚 تأكيد الطلب وإدخال معلومات التوصيل
            </button>
        </div>

        <div id="empty-cart-msg" class="text-center text-muted mt-5">
            <h4>السلة فارغة حالياً 🛍️</h4>
            <a href="/shop" class="btn btn-primary mt-3">العودة للمتجر</a>
        </div>
    </div>

    <script>
        function loadCart() {
            // استخدام مفتاح 'cart' الموحد مع باقي الصفحات
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let container = document.getElementById('cart-items-container');
            let summary = document.getElementById('cart-summary');
            let emptyMsg = document.getElementById('empty-cart-msg');
            
            container.innerHTML = '';

            if (cart.length === 0) {
                emptyMsg.classList.remove('d-none');
                summary.classList.add('d-none');
                return;
            }

            emptyMsg.classList.add('d-none');
            summary.classList.remove('d-none');

            let total = 0;
            cart.forEach((item, index) => {
                let itemTotal = item.price * (item.quantity || 1);
                total += itemTotal;

                container.innerHTML += `
                    <div class="card mb-3 p-3 shadow-sm d-flex flex-row align-items-center justify-content-between">
                        <div class="d-flex align-items-center">
                            <img src="${item['product-images'] || item.image || 'https://via.placeholder.com/60'}" style="width: 60px; height: 60px; object-fit: cover;" class="rounded ms-3">
                            <div>
                                <h5 class="mb-1">${item.name}</h5>
                                <p class="text-muted mb-0">${item.price} دج × ${item.quantity || 1}</p>
                            </div>
                        </div>
                        <div>
                            <button class="btn btn-sm btn-outline-danger" onclick="removeItem(${index})">🗑️</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('total-price').innerText = total;
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }

        function proceedToCheckout() {
            // الانتقال إلى مسار السلة في البايثون الذي أعددناه مسبقاً
            window.location.href = "/checkout_cart";
        }

        loadCart();
    </script>
</body>
</html>
