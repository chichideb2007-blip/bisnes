<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة التسوق</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; }
        .cart-container { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .total-box { font-size: 1.2rem; font-weight: bold; color: #28a745; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="cart-container">
        <h2 class="mb-4 text-center">سلة التسوق الخاصة بك</h2>
        
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>المنتج</th>
                    <th>السعر</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="cart-table-body">
                <!-- سيتم ملء البيانات هنا بواسطة JavaScript -->
            </tbody>
        </table>

        <div class="d-flex justify-content-between align-items-center mt-4">
            <div class="total-box">المجموع: <span id="total-price">0</span> دج</div>
            <div>
                <a href="/shop" class="btn btn-secondary">العودة للمتجر</a>
                <button class="btn btn-success" onclick="checkout()">إتمام الطلب</button>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. تحميل المنتجات من localStorage
    function loadCart() {
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        let tbody = document.getElementById('cart-table-body');
        let total = 0;
        
        tbody.innerHTML = '';
        
        if (cart.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="text-center">السلة فارغة</td></tr>';
        } else {
            cart.forEach((item, index) => {
                total += parseFloat(item.price);
                tbody.innerHTML += `
                    <tr>
                        <td>${item.name}</td>
                        <td>${item.price} دج</td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="removeItem(${index})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }
        document.getElementById('total-price').innerText = total;
    }

    // 2. حذف منتج من السلة
    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        loadCart(); // إعادة تحميل الجدول
    }

    // 3. إتمام الطلب (مؤقتاً يعيد توجيه لصفحة الدفع)
    function checkout() {
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        if (cart.length === 0) {
            alert("السلة فارغة!");
            return;
        }
        // هنا يمكنك التوجيه لصفحة إدخال المعلومات أو إرسال البيانات للسيرفر
        alert("جاري التحويل لصفحة إتمام الطلب...");
        window.location.href = '/checkout'; 
    }

    // تشغيل الدالة عند فتح الصفحة
    window.onload = loadCart;
</script>

</body>
</html>
