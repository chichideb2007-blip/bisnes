<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .goog-te-banner-frame.skiptranslate { display: none !important; }
        body { top: 0px !important; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .goog-te-combo {
            padding: 6px 14px;
            border-radius: 9999px;
            border: 1px solid #e5e7eb;
            outline: none;
            background-color: #f9fafb;
            font-size: 13px;
            color: #4b5563;
        }
        .store-theme-bg {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(59, 130, 246, 0.08) 0px, transparent 50%);
            min-height: 100vh;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="store-theme-bg text-gray-800 flex flex-col justify-between p-4 sm:p-6">

    <div class="max-w-3xl mx-auto w-full">
        <!-- شريط اللغة العلوي -->
        <div class="flex justify-between items-center mb-6">
            <a href="/store2" class="text-sm font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-sm border border-gray-100 transition">
                <i class="fas fa-arrow-right"></i> العودة للمتجر
            </a>
            <div id="google_translate_element"></div>
        </div>

        <!-- كرت السلة الرئيسي -->
        <div class="bg-white/95 backdrop-blur-md p-6 sm:p-8 rounded-3xl shadow-xl border border-gray-100">
            <h2 class="text-2xl font-black text-gray-900 mb-6 flex items-center gap-3 border-b border-gray-100 pb-4">
                <span class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-lg shadow-inner">
                    <i class="fas fa-shopping-cart"></i>
                </span>
                سلة المشتريات
            </h2>

            <!-- حالة السلة الفارغة -->
            <div id="empty-cart-msg" class="hidden text-center py-12">
                <div class="w-20 h-20 bg-indigo-50 text-indigo-400 rounded-full mx-auto flex items-center justify-center text-3xl mb-4">
                    <i class="fas fa-shopping-bag"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">السلة فارغة حالياً 🛍️</h3>
                <p class="text-gray-400 text-sm mb-6">لم تقم بإضافة أي وجبة إلى سلتك بعد.</p>
                <a href="/store2" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-2xl shadow-lg shadow-indigo-600/30 transition-all text-sm">
                    <i class="fas fa-utensils"></i> استعراض الوجبات
                </a>
            </div>

            <!-- حاوية المنتجات والسعر الكلي -->
            <div id="cart-content" class="hidden">
                <div id="cart-items-container" class="divide-y divide-gray-100 mb-6">
                    <!-- تعبئة عناصر السلة تلقائياً عبر السكريبت -->
                </div>

                <!-- المجموع الكلي -->
                <div class="flex justify-between items-center font-bold text-lg sm:text-xl mb-6 bg-indigo-50/50 p-4 rounded-2xl border border-indigo-100">
                    <span class="text-gray-700">المجموع الكلي:</span>
                    <span id="total-price" class="text-indigo-600 font-black">0 دج</span>
                </div>

                <!-- أزرار الإجراءات -->
                <div class="flex flex-col sm:flex-row justify-between gap-3">
                    <a href="/store2" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-2xl font-bold transition text-center text-sm flex items-center justify-center gap-2">
                        <i class="fas fa-arrow-right"></i> متابعة التسوق
                    </a>
                    <button onclick="proceedToCheckout()" id="checkout-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3 rounded-2xl font-bold transition shadow-lg shadow-emerald-600/20 text-center text-sm flex items-center justify-center gap-2">
                        <span>إتمام الطلب والتوصيل</span>
                        <i class="fas fa-check"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'ar',
        includedLanguages: 'ar,en,fr,es',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('user_cart')) || [];
            let container = document.getElementById('cart-items-container');
            let cartContent = document.getElementById('cart-content');
            let emptyMsg = document.getElementById('empty-cart-msg');
            
            container.innerHTML = '';

            if (cart.length === 0) {
                emptyMsg.classList.remove('hidden');
                cartContent.classList.add('hidden');
                return;
            }

            emptyMsg.classList.add('hidden');
            cartContent.classList.remove('hidden');

            let total = 0;
            cart.forEach((item, index) => {
                let quantity = parseInt(item.quantity) || 1;
                let price = parseFloat(item.price) || 0;
                let itemTotal = price * quantity;
                total += itemTotal;

                let imageHtml = item.image 
                    ? `<img src="${item.image}" alt="${item.name}" class="w-16 h-16 object-cover rounded-2xl shadow-sm">`
                    : `<div class="w-16 h-16 bg-gray-100 text-gray-300 rounded-2xl flex items-center justify-center"><i class="fas fa-image text-2xl"></i></div>`;

                container.innerHTML += `
                    <div class="flex flex-col sm:flex-row justify-between items-center py-4 gap-4">
                        <div class="flex items-center gap-4 w-full sm:w-auto">
                            ${imageHtml}
                            <div>
                                <h4 class="font-bold text-gray-800 text-sm sm:text-base mb-1">${item.name}</h4>
                                <div class="text-xs text-gray-500 font-medium">
                                    <span class="text-indigo-600 font-bold">${price} دج</span> × ${quantity}
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex items-center justify-between w-full sm:w-auto gap-6 border-t sm:border-0 pt-3 sm:pt-0 border-gray-50">
                            <span class="font-black text-indigo-600 text-base">${itemTotal} دج</span>
                            <button onclick="removeItem(${index})" class="text-rose-500 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                                <i class="fas fa-trash"></i> حذف
                            </button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('total-price').innerText = total + " دج";
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('user_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('user_cart', JSON.stringify(cart));
            loadCart();
        }

        function proceedToCheckout() {
            window.location.href = "/store2_checkout_page";
        }

        document.addEventListener("DOMContentLoaded", loadCart);
    </script>
</body>
</html>
