<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة طلبات المطعم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-amber-50/30 text-gray-800 min-h-screen flex flex-col justify-between">

    <header class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-100 py-4 px-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-black text-gray-900 flex items-center gap-2">
                <i class="fas fa-shopping-bag text-amber-600"></i> سلة طلبات المطعم
            </h1>
            <a href="/store2" class="text-sm font-bold text-amber-700 bg-amber-50 px-4 py-2 rounded-full border border-amber-200 hover:bg-amber-100 transition-colors">العودة لقائمة الطعام</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        <div id="cart-items-container" class="space-y-4 mb-6"></div>

        <div id="cart-summary" class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 hidden space-y-5">
            <!-- 🍽️ خيار نوع الطلب (داخل المطعم أو توصيل للمنزل) -->
            <div class="border-b border-gray-100 pb-4">
                <label class="block text-xs font-bold text-gray-600 mb-2">نوع الطلب:</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center justify-center gap-2 p-3 border-2 border-amber-200 rounded-2xl cursor-pointer bg-amber-50/50 hover:bg-amber-100/50 transition-all font-bold text-sm">
                        <input type="radio" name="order_type" value="dine_in" onchange="toggleOrderType()" checked class="accent-amber-600">
                        <span>داخل المطعم</span>
                    </label>
                    <label class="flex items-center justify-center gap-2 p-3 border-2 border-gray-200 rounded-2xl cursor-pointer hover:bg-gray-50 transition-all font-bold text-sm">
                        <input type="radio" name="order_type" value="delivery" onchange="toggleOrderType()" class="accent-amber-600">
                        <span>للمنزل (توصيل)</span>
                    </label>
                </div>
            </div>

            <!-- 🪑 خانة رقم الطاولة (تظهر حصرياً لطلبات داخل المطعم ويكتبها الزبون) -->
            <div id="table-number-container" class="border-b border-gray-100 pb-4">
                <label class="block text-xs font-bold text-gray-600 mb-1">رقم الطاولة:</label>
                <input type="number" id="table-number-input" placeholder="اكتب رقم الطاولة هنا (مثال: 4)" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 outline-none text-sm font-bold focus:border-amber-500">
            </div>

            <div class="flex justify-between items-center">
                <span class="text-gray-500 font-bold">المجموع الكلي للوجبات:</span>
                <span class="text-2xl font-black text-amber-600"><span id="total-price">0</span> دج</span>
            </div>

            <button onclick="submitOrder()" class="w-full bg-amber-600 hover:bg-amber-700 active:scale-95 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-amber-600/20 transition-all flex items-center justify-center gap-2 cursor-pointer">
                <i class="fas fa-check-circle"></i> تأكيد وإرسال الطلب
            </button>
        </div>

        <div id="empty-cart-msg" class="text-center py-16 bg-white rounded-3xl shadow-sm border border-gray-100 hidden flex flex-col items-center gap-3">
            <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center text-2xl">
                <i class="fas fa-utensils"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-800 mb-1">سلة الطلبات فارغة حالياً</h3>
            <p class="text-gray-500 text-sm mb-4">لم تقم بإضافة أي وجبات أو مشروبات إلى السلة بعد</p>
            <a href="/store2" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-6 py-2.5 rounded-xl text-sm inline-block shadow-md shadow-amber-600/20 transition-colors">تصفح قائمة الطعام</a>
        </div>
    </main>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('store2_cart')) || [];
            let container = document.getElementById('cart-items-container');
            let summary = document.getElementById('cart-summary');
            let emptyMsg = document.getElementById('empty-cart-msg');
            
            container.innerHTML = '';

            if (cart.length === 0) {
                emptyMsg.classList.remove('hidden');
                summary.classList.add('hidden');
                return;
            }

            emptyMsg.classList.add('hidden');
            summary.classList.remove('hidden');

            let total = 0;
            cart.forEach((item, index) => {
                let itemPrice = parseFloat(item.price) || 0;
                let itemQty = parseInt(item.quantity) || 1;
                let itemTotal = itemPrice * itemQty;
                total += itemTotal;

                let imgSrc = item['product-images'] || item.image || 'https://via.placeholder.com/80';

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between gap-4">
                        <div class="flex items-center gap-4">
                            <img src="${imgSrc}" style="width: 70px; height: 70px; object-fit: cover;" class="rounded-xl border border-amber-100">
                            <div>
                                <h3 class="font-bold text-gray-800">${item.name}</h3>
                                <p class="text-amber-600 font-black text-sm">${itemPrice} دج</p>
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-4">
                            <div class="flex items-center border border-amber-200 rounded-xl overflow-hidden bg-amber-50/50">
                                <button onclick="changeQuantity(${index}, -1)" class="px-3 py-1 font-bold text-amber-700 hover:bg-amber-100 transition-colors">-</button>
                                <span class="px-3 font-bold text-gray-800">${itemQty}</span>
                                <button onclick="changeQuantity(${index}, 1)" class="px-3 py-1 font-bold text-amber-700 hover:bg-amber-100 transition-colors">+</button>
                            </div>
                            <span class="font-black text-gray-900 min-w-[70px] text-left">${itemTotal} دج</span>
                            <button onclick="removeItem(${index})" class="text-rose-500 hover:text-rose-700 p-2 transition-colors"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('total-price').innerText = total;
        }

        // إظهار أو إخفاء خانة رقم الطاولة بناءً على اختيار الزبون
        function toggleOrderType() {
            let orderType = document.querySelector('input[name="order_type"]:checked').value;
            let tableContainer = document.getElementById('table-number-container');
            
            if (orderType === 'dine_in') {
                tableContainer.style.display = 'block';
            } else {
                tableContainer.style.display = 'none';
            }
        }

        function changeQuantity(index, delta) {
            let cart = JSON.parse(localStorage.getItem('store2_cart')) || [];
            if (cart[index]) {
                cart[index].quantity = (parseInt(cart[index].quantity) || 1) + delta;
                if (cart[index].quantity < 1) cart[index].quantity = 1;
                localStorage.setItem('store2_cart', JSON.stringify(cart));
                loadCart();
            }
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('store2_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('store2_cart', JSON.stringify(cart));
            loadCart();
        }

        function submitOrder() {
            let orderType = document.querySelector('input[name="order_type"]:checked').value;
            
            if (orderType === 'dine_in') {
                let tableNumber = document.getElementById('table-number-input').value.trim();
                if (!tableNumber) {
                    alert('الرجاء إدخال رقم الطاولة التي تجلس عليها');
                    return;
                }
                localStorage.setItem('store2_table_number', tableNumber);
                localStorage.setItem('store2_order_type', 'داخل المطعم');
            } else {
                localStorage.removeItem('store2_table_number');
                localStorage.setItem('store2_order_type', 'توصيل للمنزل');
            }

            window.location.href = "/store2_checkout_page";
        }

        loadCart();
    </script>
</body>
</html>
