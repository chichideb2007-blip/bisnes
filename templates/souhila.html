<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page de Souhila</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .product-image {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .contact-box {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 5px;
        }
        .contact-link {
            display: block;
            margin-top: 8px;
            color: #28a745;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }
        .contact-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Espace de Souhila</h2>

    <!-- مكان الصورة (يمكنك تغيير رابط الصورة أو وضع اسم ملف من مجلد static) -->
    <img src="{{ url_for('static', filename='images/default.jpg') }}" alt="Image de présentation" class="product-image">

    <!-- نموذج إدخال رقم الهاتف -->
    <form method="POST">
        <div class="form-group">
            <label for="phone_number">Entrez votre numéro de téléphone :</label>
            <input type="text" id="phone_number" name="phone_number" value="{{ phone_number }}" placeholder="Ex: 0612345678" required>
        </div>
        <button type="submit" class="btn">Enregistrer le numéro</button>
    </form>

    <!-- إذا تم إدخال الرقم، يظهر تلقائياً كـ رابط تفاعلي للإرسال أو الاتصال -->
    {% if phone_number %}
        <div class="contact-box">
            <p style="margin: 0; color: #333;">Contactez-moi directement :</p>
            <a href="https://wa.me/{{ phone_number }}" class="contact-link" target="_blank">💬 WhatsApp : {{ phone_number }}</a>
            <a href="tel:{{ phone_number }}" class="contact-link" style="color: #007bff;">📞 Appeler : {{ phone_number }}</a>
        </div>
    {% endif %}
</div>

</body>
</html>
