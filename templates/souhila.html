<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>French Access - Organisme de Formation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f5f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border-top: 5px solid #1b2a4a;
        }
        .logo-img {
            width: 100%;
            max-height: 120px;
            object-fit: contain;
            margin-bottom: 20px;
        }
        h2 {
            color: #1b2a4a;
            font-size: 22px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #e36442;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #1b2a4a;
        }
        .btn {
            background-color: #1b2a4a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #2c426e;
        }
        .contact-box {
            margin-top: 25px;
            padding: 20px;
            background: #f4f6f9;
            border-radius: 8px;
        }
        .contact-link {
            display: block;
            margin-top: 12px;
            padding: 10px;
            background: #25d366;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.3s;
        }
        .contact-link:hover {
            background: #20ba5a;
        }
        .call-link {
            background: #1b2a4a;
        }
        .call-link:hover {
            background: #2c426e;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- شعار الشركة (يمكنك وضع صورة الشعار في مجلد static/images وتسميتها logo.jpg مثلاً) -->
    <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="French Access Logo" class="logo-img">

    <h2>French Access</h2>
    <div class="subtitle">Organisme de Formation</div>

    <!-- إذا كان المدير مسجل دخول، تظهر له خانة لتعديل رقم الهاتف مرة واحدة -->
    {% if is_admin %}
        <form method="POST">
            <div class="form-group">
                <label for="phone_number">Modifier le numéro de contact :</label>
                <input type="text" id="phone_number" name="phone_number" value="{{ phone_number }}" placeholder="Ex: 0612345678" required>
            </div>
            <button type="submit" class="btn">Enregistrer le numéro</button>
        </form>
    {% endif %}

    <!-- أزرار التفاعل التلقائية للزوار والزبائن برقم الهاتف المخزن -->
    {% if phone_number %}
        <div class="contact-box">
            <p style="margin: 0 0 10px 0; color: #333; font-weight: 600;">Contactez-nous :</p>
            <a href="https://wa.me/{{ phone_number }}" class="contact-link" target="_blank">💬 WhatsApp : {{ phone_number }}</a>
            <a href="tel:{{ phone_number }}" class="contact-link call-link">📞 Appeler : {{ phone_number }}</a>
        </div>
    {% else %}
        {% if not is_admin %}
            <p style="color: #777; font-size: 14px;">Contactez-nous bientôt pour plus d'informations sur nos formations.</p>
        {% endif %}
    {% endif %}
</div>

</body>
</html>
