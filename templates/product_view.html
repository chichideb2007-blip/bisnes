<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 p-4">

    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg overflow-hidden">
        <!-- صورة المنتج -->
        <div class="h-64 bg-gray-200">
            <img src="{{ product['product-images'] }}" alt="{{ product.name }}" class="w-full h-full object-cover">
        </div>

        <!-- تفاصيل المنتج -->
        <div class="p-6">
            <h1 class="text-3xl font-bold mb-2">{{ product.name }}</h1>
            <p class="text-2xl text-indigo-600 font-bold mb-4">{{ product.price }} {{ currency or 'د.ج' }}</p>
            
            <div class="border-t pt-4">
                <h3 class="font-bold mb-2">حالة التوفر:</h3>
                {% if product.quantity > 0 %}
                    <span class="text-green-600 font-bold">متوفر ({{ product.quantity }} قطعة)</span>
                {% else %}
                    <span class="text-red-600 font-bold">نفذت الكمية</span>
                {% endif %}
            </div>

            <!-- زر العودة -->
            <div class="mt-8">
                <a href="/shop" class="block w-full text-center bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 rounded-xl transition">
                    العودة للمتجر
                </a>
            </div>
        </div>
    </div>
</body>
</html>
