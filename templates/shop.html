<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .checkout-card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        .form-label { font-weight: bold; color: #333; }
        .price-box { background: #e9ecef; padding: 15px; border-radius: 10px; margin: 20px 0; }
        .btn-confirm { background-color: #198754; color: white; padding: 12px; font-weight: bold; border: none; border-radius: 8px; flex-grow: 1; }
        .btn-back { background-color: #6c757d; color: white; padding: 12px; font-weight: bold; border: none; border-radius: 8px; text-decoration: none; text-align: center; }

        /* إخفاء شريط جوجل العلوي وتثبيت الصفحة لمنع الاهتزاز عند الترجمة */
        .goog-te-banner-frame.skiptranslate {
            display: none !important;
        }
        body {
            top: 0px !important;
        }
        /* تنسيق عنصر اختيار اللغة ليطابق تصميم الموقع */
        .goog-te-combo {
            padding: 6px 12px;
            border-radius: 9999px;
            border: 1px solid #d1d5db;
            outline: none;
            background-color: white;
            font-size: 14px;
            color: #374151;
        }
    </style>
</head>
<body>

<!-- شريط علوي صغير لأداة الترجمة -->
<div class="container mb-3" style="max-width: 600px;">
    <div class="d-flex justify-content-end">
        <div id="google_translate_element"></div>
    </div>
</div>

<div class="container mt-2">
    <div class="checkout-card">
        <h3 class="text-center mb-4">معلومات الطلب</h3>
        
        <div class="card p-3 mb-3 border-0 bg-light">
            <h5>المنتج: <span class="text-indigo">{{ product.name }}</span></h5>
            <p class="mb-0 text-danger fw-bold">السعر: {{ product.price }} دج</p>
        </div>

        <form action="/submit-order" method="POST">
            <input type="hidden" name="product_id" value="{{ product.id }}">

            <!-- خانة البلد -->
            <div class="mb-3">
                <label for="country" class="form-label">البلد</label>
                <select id="country" name="country" class="form-select" onchange="toggleCountryFields()" required>
                    <option value="" disabled selected>-- اختر الدولة --</option>
                    <option value="algeria">الجزائر 🇩🇿</option>
                    <option value="jordan">الأردن 🇯🇴</option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">الاسم</label>
                    <input type="text" name="customer_name" class="form-control" required placeholder="الاسم">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">اللقب</label>
                    <input type="text" name="customer_last_name" class="form-control" required placeholder="اللقب">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">رقم الهاتف</label>
                <input type="tel" name="phone" class="form-control" required placeholder="0XXXXXXXXX">
            </div>

            <!-- خانة ولايات الجزائر (تظهر افتراضياً أو عند اختيار الجزائر) -->
            <div class="mb-3" id="algeria_section">
                <label class="form-label">الولاية</label>
                <select id="wilaya" name="wilaya" class="form-select" onchange="calculateTotal()" required>
                    <option value="">-- اختر الولاية --</option>
                    {% for wilaya in rates %}
                        <option value="{{ wilaya.id }}" 
                                data-home="{{ wilaya.home_price }}" 
                                data-office="{{ wilaya.office_price }}">
                            {{ wilaya.wilaya_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- خانة محافظات ومناطق الأردن (مخفية ولا تظهر إلا عند اختيار الأردن) -->
            <div class="mb-3 d-none" id="jordan_section">
                <label for="jordan_region" class="form-label">المحافظة والمنطقة (الأردن)</label>
                <select id="jordan_region" name="jordan_region" class="form-select">
                    <option value="" disabled selected>-- اختر المحافظة والمنطقة --</option>
                    
                    <optgroup label="محافظة العاصمة (عمان)">
                        <option value="amman_center">وسط البلد (العاصمة)</option>
                        <option value="jubeiha">الجبيهة</option>
                        <option value="tla_ali">تلاع العلي</option>
                        <option value="khalda">خلدا</option>
                        <option value="abdoun">عبدون</option>
                        <option value="sweifieh">الصويفية</option>
                        <option value="shmeisani">الشميساني</option>
                        <option value="tabarbour">طبربور</option>
                        <option value="abu_nsair">أبو نصير</option>
                        <option value="jabal_amman">جبل عمان</option>
                        <option value="jabal_hussain">جبل الحسين</option>
                        <option value="shafa_badran">شفا بدران</option>
                        <option value="sahab">سحاب</option>
                        <option value="wadi_seir">وادي السير</option>
                        <option value="marj_el_hammam">مرج الحمام</option>
                        <option value="muqablain">المقابلين</option>
                        <option value="quwaysimah">القويسمة</option>
                        <option value="jawwadeh">الجيدة</option>
                    </optgroup>

                    <optgroup label="محافظة الزرقاء">
                        <option value="zarqa_city">مدينة الزرقاء</option>
                        <option value="zarqa_new">الزرقاء الجديدة</option>
                        <option value="russayfa">الرصيفة</option>
                        <option value="dhulayl">الضليل</option>
                        <option value="azraq">الأزرق</option>
                        <option value="hashimiyya">الهاشمية</option>
                    </optgroup>

                    <optgroup label="محافظة إربد">
                        <option value="irbid_city">مدينة إربد</option>
                        <option value="ramtha">الرمثا</option>
                        <option value="sarar">صريح</option>
                        <option value="aidoun">إيدون</option>
                        <option value="husn">الحصن</option>
                        <option value="kurayyimah">الكورة</option>
                        <option value="bani_kinanah">باني كنانة</option>
                        <option value="mazar_shamali">المزار الشمالي</option>
                        <option value="taybeh">الطيبة</option>
                    </optgroup>

                    <optgroup label="محافظة البلقاء">
                        <option value="salt_city">السلط (المركز)</option>
                        <option value="baqaa">البقعة</option>
                        <option value="ein_basha">عين الباشا</option>
                        <option value="fuhis">الفحيص</option>
                        <option value="mahis">ماحص</option>
                    </optgroup>

                    <optgroup label="محافظة مادبا">
                        <option value="madaba_city">مدينة مادبا</option>
                        <option value="dhiban">ذيبان</option>
                    </optgroup>

                    <optgroup label="محافظة جرش">
                        <option value="jerash_city">مدينة جرش</option>
                        <option value="souf">صوف</option>
                        <option value="deir_al_yousef">برما</option>
                    </optgroup>

                    <optgroup label="محافظة عجلون">
                        <option value="ajloun_city">مدينة عجلون</option>
                        <option value="kufranjah">كفرنجة</option>
                        <option value="anjarah">عنجرة</option>
                    </optgroup>

                    <optgroup label="محافظة المفرق">
                        <option value="mafraq_city">مدينة المفرق</option>
                        <option value="sabha">الصبحا</option>
                        <option value="ruwaished">الرويشد</option>
                    </optgroup>

                    <optgroup label="محافظة الكرك">
                        <option value="karak_city">مدينة الكرك</option>
                        <option value="mutah">مؤة</option>
                        <option value="mazar_janoubi">المزار الجنوبي</option>
                        <option value="qatraneh">القطرانة</option>
                    </optgroup>

                    <optgroup label="محافظة الطفيلة">
                        <option value="tafilah_city">مدينة الطفيلة</option>
                        <option value="buseira">بصيرة</option>
                        <option value="hasa">الحسا</option>
                    </optgroup>

                    <optgroup label="محافظة معان">
                        <option value="maan_city">مدينة معان</option>
                        <option value="wadi_musa">وادي موسى (البتراء)</option>
                        <option value="shobak">الشوبك</option>
                        <option value="jafr">الجفر</option>
                    </optgroup>

                    <optgroup label="محافظة العقبة">
                        <option value="aqaba_city">مدينة العقبة (المركز)</option>
                        <option value="quwayrah">القويرة</option>
                        <option value="wadi_rum">وادي رم</option>
                    </optgroup>
                </select>
            </div>

            <!-- حاوية خانة البلدية (تظهر للجزائر وتختفي للأردن) -->
            <div class="mb-3" id="baladiya_container">
                <label class="form-label">البلدية</label>
                <input type="text" name="baladia" id="baladiya_input" class="form-control" placeholder="أدخل اسم البلدية" required>
            </div>

            <div class="mb-3">
                <label class="form-label">العنوان بالتفصيل</label>
                <input type="text" name="address" class="form-control" placeholder="الحي أو الشارع" required>
            </div>

            <div class="mb-3" id="delivery_type_box">
                <label class="form-label">طريقة التوصيل</label>
                <select id="delivery_type" name="delivery_type" class="form-select" onchange="calculateTotal()" required>
                    <option value="home">توصيل للمنزل</option>
                    <option value="office">توصيل للمكتب</option>
                </select>
            </div>

            <input type="hidden" name="delivery_price" id="delivery_price_input" value="0">

            <div class="price-box">
                <h5>سعر التوصيل: <span id="shipping_display">0</span> دج</h5>
                <h4 class="text-primary mt-2">المجموع الكلي: <span id="total_display">{{ product.price }}</span> دج</h4>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn-confirm">تأكيد الطلب</button>
                <a href="/store2" class="btn-back">رجوع</a>
            </div>
        </form>
    </div>
</div>

<!-- سكربت الترجمة من جوجل -->
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'ar',
    includedLanguages: 'ar,en,fr,es',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE
  }, 'google_translate_element');
}
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script>
    let basePrice = parseFloat("{{ product.price }}");

    // دالة تبديل الحقول بناءً على الدولة المتاحة والتحكم في البلدية
    function toggleCountryFields() {
        const country = document.getElementById('country').value;
        const algeriaSection = document.getElementById('algeria_section');
        const jordanSection = document.getElementById('jordan_section');
        const wilayaSelect = document.getElementById('wilaya');
        const jordanSelect = document.getElementById('jordan_region');
        const baladiyaContainer = document.getElementById('baladiya_container');
        const baladiyaInput = document.getElementById('baladiya_input');

        if (country === 'algeria') {
            algeriaSection.classList.remove('d-none');
            jordanSection.classList.add('d-none');
            wilayaSelect.setAttribute('required', 'required');
            jordanSelect.removeAttribute('required');
            jordanSelect.value = "";

            // إظهار خانة البلدية وجعلها مطلوبة للجزائر
            if (baladiyaContainer) {
                baladiyaContainer.style.display = "block";
                if (baladiyaInput) baladiyaInput.setAttribute('required', 'required');
            }
        } else if (country === 'jordan') {
            algeriaSection.classList.add('d-none');
            jordanSection.classList.remove('d-none');
            jordanSelect.setAttribute('required', 'required');
            wilayaSelect.removeAttribute('required');
            wilayaSelect.value = "";

            // إخفاء خانة البلدية تماماً للأردن وإلغاء إلزاميتها وتفريغها
            if (baladiyaContainer) {
                baladiyaContainer.style.display = "none";
                if (baladiyaInput) {
                    baladiyaInput.removeAttribute('required');
                    baladiyaInput.value = "";
                }
            }
            
            // تصفير سعر التوصيل مؤقتاً لزبائن الأردن
            document.getElementById('shipping_display').innerText = "0";
            document.getElementById('delivery_price_input').value = 0;
            document.getElementById('total_display').innerText = basePrice;
        }
        calculateTotal();
    }

    function calculateTotal() {
        const country = document.getElementById('country').value;
        const shippingDisplay = document.getElementById('shipping_display');
        const totalDisplay = document.getElementById('total_display');
        const deliveryPriceInput = document.getElementById('delivery_price_input');

        let shippingPrice = 0;

        if (country === 'algeria') {
            const wilayaSelect = document.getElementById('wilaya');
            const deliveryType = document.getElementById('delivery_type').value;
            const selectedOption = wilayaSelect.options[wilayaSelect.selectedIndex];
            
            if (selectedOption && selectedOption.value !== "") {
                shippingPrice = (deliveryType === 'home') ? parseFloat(selectedOption.dataset.home) : parseFloat(selectedOption.dataset.office);
            }
        } else if (country === 'jordan') {
            shippingPrice = 0; // يمكنك تعديل سعر التوصيل الثابت للأردن لاحقاً هنا إذا أردت
        }
        
        shippingDisplay.innerText = shippingPrice;
        totalDisplay.innerText = (basePrice + shippingPrice);
        deliveryPriceInput.value = shippingPrice;
    }
</script>

</body>
</html>
