<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>متجرنا</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; padding: 20px; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        
        /* تنسيق البطاقة الجديد */
        .card { 
            border-radius: 12px; 
            overflow: hidden; 
            height: 100%; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        
        /* تنسيق الصورة الصغير */
        .card-img-top { 
            height: 120px; 
            object-fit: cover; 
            transition: transform 0.2s;
        }

        .card:hover .card-img-top { 
            transform: scale(1.05); 
        }
        
        .price { color: #28a745; font-weight: bold; margin: 5px 0; }
    </style>
</head>
<body>

    <h1>مرحباً بك في متجرنا</h1>
    
    <div class="container">
        <div class="row">
            {% for product in products %}
            <!-- col-6 تجعل المنتجات تظهر منتجين في الصف -->
            <div class="col-6 mb-3">
                <div class="card h-100 shadow-sm">
                    <!-- عرض الصورة (المنطق الأصلي) -->
                    {% if product.image_url or product['product-images'] %}
                        <img src="{{ product.image_url or product['product-images'] }}" class="card-img-top" alt="{{ product.name }}">
                    {% endif %}
                    
                    <div class="card-body p-2 text-center">
                        <h6 class="card-title">{{ product.name }}</h6>
                        <p class="price">{{ product.price }} {{ currency or 'DA' }}</p>

                        <!-- منطق المخزون (المنطق الأصلي) -->
                        {% if product.quantity > 0 %}
                            <a href="{{ url_for('order_page', product_id=product.id) }}" class="btn btn-sm btn-primary w-100 mt-2">شراء</a>
                        {% else %}
                            <button class="btn btn-sm btn-danger w-100 mt-2" disabled>غير متوفر</button>
                        {% endif %}
                    </div>
                </div>
            </div>
            {% else %}
                <p class="text-center">لا توجد منتجات متاحة حالياً.</p>
            {% endfor %}
        </div>
    </div>

</body>
</html>
