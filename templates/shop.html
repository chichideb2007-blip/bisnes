<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ current_company if current_company else 'المتجر الإلكتروني' }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .goog-te-banner-frame.skiptranslate { display: none !important; }
        body { top: 0px !important; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col justify-between min-h-screen">

    <header class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-lg font-extrabold text-gray-900">
                {{ current_company if current_company else 'متجرنا' }}
            </h1>
            <div class="flex items-center gap-3">
                <a href="/cart" class="text-sm font-bold text-indigo-600 bg-indigo-50 px-4 py-2 rounded-full border border-indigo-100 flex items-center gap-2">
                    <i class="fas fa-shopping-cart"></i> السلة (<span id="cart-count">0</span>)
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        {% if products %}
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                {% for product in products %}
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex flex-col justify-between product-card"
                         data-id="{{ product.id }}"
                         data-name="{{ product.name }}"
                         data-price="{{ product.price }}"
                         data-image="{{ product['product-images'] if product['product-images'] else '' }}">
                        
                        <div>
                            <div class="w-full h-36 bg-gray-100 rounded-xl overflow-hidden mb-3">
                                {% if product['product-images'] %}
                                    <img src="{{ product['product-images'] }}" class="w-full h-full object-cover" alt="{{ product.name }}">
                                {% else %}
                                    <div class="w-full h-full flex items-center justify-center text-gray-400">
                                        <i class="fas fa-image text-2xl"></i>
                                    </div>
                                {% endif %}
                            </div>
                            <h3 class="font-bold text-gray-800 text-sm mb-1 line-clamp-1 product-name">{{ product.name }}</h3>
                            <p class="text-indigo-600 font-black text-base mb-3"><span class="product-price">{{ product.price }}</span> دج</p>
                        </div>

                        <div class="space-y-2">
                            <a href="/checkout/{{ product.id }}" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-xl text-center block text-xs">
                                شراء الآن
                            </a>
                            <button onclick="addToCart(this)" class="w-full bg-gray-100 hover:bg-indigo-50 text-indigo-700 font-bold py-2 rounded-xl transition-all text-xs border border-gray-200">
                                <i class="fas fa-cart-plus"></i> إضافة للسلة
                            </button>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="text-center py-20 text-gray-400">لا توجد منتجات متاحة حالياً</div>
        {% endif %}
    </main>

    <script>
        function updateCartCount() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let totalCount = cart.reduce((sum, item) => sum + (parseInt(item.quantity) || 1), 0);
            let countEl = document.getElementById('cart-count');
            if (countEl) countEl.innerText = totalCount;
        }

        function addToCart(button) {
            let card = button.closest('.product-card');
            let id = card.getAttribute('data-id');
            let name = card.getAttribute('data-name');
            let price = parseFloat(card.getAttribute('data-price')) || 0;
            let image = card.getAttribute('data-image');

            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            let existingItem = cart.find(item => item.id == id);
            if (existingItem) {
                existingItem.quantity = (parseInt(existingItem.quantity) || 1) + 1;
            } else {
                cart.push({
                    id: id,
                    name: name,
                    price: price,
                    'product-images': image,
                    quantity: 1
                });
            }

            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            alert("تمت الإضافة إلى السلة بنجاح! 🛒");
        }

        window.onload = updateCartCount;
    </script>
</body>
</html>
