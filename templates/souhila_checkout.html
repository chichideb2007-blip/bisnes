<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الطلب - موقع سهيلة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/rtl.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: Tahoma, sans-serif; }
        .checkout-container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .btn-primary { background-color: #e83e8c; border: none; }
        .btn-primary:hover { background-color: #d91a72; }
    </style>
</head>
<body>

    <div class="checkout-container">
        <h3 class="text-center mb-4 text-secondary">إتمام حجز الدورة / الطلب</h3>
        
        <form action="/submit-order" method="POST">
            <!-- تحديد أن الطلب يخص موقع سهيلة -->
            <input type="hidden" name="is_souhila" value="true">
            
            <div class="mb-3">
                <label class="form-label fw-bold">الاسم الكامل</label>
                <input type="text" class="form-control" name="customer_name" required placeholder="أدخل اسمك الكامل">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">رقم الهاتف</label>
                <input type="tel" class="form-control" name="phone" required placeholder="05 / 06 / 07 ...">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">اختر الدورة / الخدمة المطلوبة</label>
                <select class="form-control" name="cart_data_json" id="courseSelect" required>
                    <option value="" disabled selected>-- اختر الدورة --</option>
                    {% for course in courses %}
                    <option value='[{"name": "{{ course.title }}", "price": "{{ course.price }}", "quantity": 1}]'>
                        {{ course.title }} - {{ course.price }} دج
                    </option>
                    {% endfor %}
                </select>
                <!-- حقل مخفي يرسل البيانات بالصيغة التي يتوقعها سيرفر المعالجة المشترك -->
                <input type="hidden" name="cart_data" id="cartDataInput">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">الولاية</label>
                <select class="form-control" name="wilaya" id="wilayaSelect" required>
                    <option value="" disabled selected>-- اختر ولايتك --</option>
                    {% for rate in rates %}
                    <option value="{{ rate.id }}" data-home="{{ rate.home_price }}" data-office="{{ rate.office_price }}">
                        {{ rate.id }} - {{ rate.wilaya_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">البلدية</label>
                <input type="text" class="form-control" name="baladiya" required placeholder="أدخل اسم البلدية">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">طريقة الاستلام / التوصيل</label>
                <select class="form-control" name="delivery_type" id="deliveryType" required>
                    <option value="home">توصيل للمنزل</option>
                    <option value="office">توصيل للمكتب (شركة التوصيل)</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">سعر التوصيل:</label>
                <span id="deliveryPriceDisplay" class="text-success fw-bold">0</span> دج
                <input type="hidden" name="delivery_price" id="deliveryPriceInput" value="0">
            </div>

            <hr>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold fs-5">تأكيد الطلب والحجز</button>
        </form>
    </div>

    <script>
        const wilayaSelect = document.getElementById('wilayaSelect');
        const deliveryType = document.getElementById('deliveryType');
        const deliveryPriceDisplay = document.getElementById('deliveryPriceDisplay');
        const deliveryPriceInput = document.getElementById('deliveryPriceInput');
        const courseSelect = document.getElementById('courseSelect');
        const cartDataInput = document.getElementById('cartDataInput');

        function updateDeliveryPrice() {
            const selectedOption = wilayaSelect.options[wilayaSelect.selectedIndex];
            if (!selectedOption.value) return;

            let price = 0;
            if (deliveryType.value === 'home') {
                price = selectedOption.getAttribute('data-home') || 0;
            } else {
                price = selectedOption.getAttribute('data-office') || 0;
            }

            deliveryPriceDisplay.textContent = price;
            deliveryPriceInput.value = price;
        }

        wilayaSelect.addEventListener('change', updateDeliveryPrice);
        deliveryType.addEventListener('change', updateDeliveryPrice);

        courseSelect.addEventListener('change', function() {
            cartDataInput.value = this.value;
        });
        
        // تعيين القيمة أولياً إن وجدت
        if(courseSelect.value) {
            cartDataInput.value = courseSelect.value;
        }
    </script>
</body>
</html>
