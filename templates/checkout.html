<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Tajawal', sans-serif; }
        .checkout-card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-label { font-weight: bold; color: #333; }
        .btn-confirm { background-color: #007bff; color: white; padding: 12px; font-weight: bold; }
    </style>
</head>
<body class="p-3">

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6 checkout-card">
            <h4 class="text-center mb-4">معلومات التوصيل</h4>
            <form action="/submit_order" method="POST">
                <input type="hidden" name="product_id" value="{{ product.id }}">
                <input type="hidden" name="base_price" value="{{ product.price }}">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">الاسم الكامل</label>
                        <input type="text" name="customer_name" class="form-control" required placeholder="أدخل اسمك">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">رقم الهاتف</label>
                        <input type="tel" name="phone" class="form-control" required placeholder="0XXXXXXXXX">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">الولاية</label>
                    <select name="wilaya" class="form-select" onchange="updateDelivery()" id="wilaya" required>
                        <option value="">-- اختر الولاية --</option>
                        {% for rate in rates %}
                        <option value="{{ rate.id }}" data-home="{{ rate.home_price }}" data-office="{{ rate.office_price }}">
                            {{ rate.wilaya_name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">نوع التوصيل</label>
                    <select name="delivery_type" class="form-select" onchange="calculateTotal()" id="delivery_type" required>
                        <option value="home">توصيل للمنزل</option>
                        <option value="office">توصيل للمكتب</option>
                    </select>
                </div>

                <div class="p-3 mb-3 bg-light rounded text-center">
                    <h5>الإجمالي: <span id="total_display" class="text-primary">{{ product.price }}</span> دج</h5>
                </div>

                <button type="submit" class="btn btn-confirm w-100">تأكيد الطلب</button>
            </form>
        </div>
    </div>
</div>

<script>
    function calculateTotal() {
        const basePrice = parseFloat(document.querySelector('input[name="base_price"]').value) || 0;
        const wilayaSelect = document.getElementById('wilaya');
        const deliveryType = document.getElementById('delivery_type').value;
        const selectedOption = wilayaSelect.options[wilayaSelect.selectedIndex];
        
        let shippingPrice = 0;
        if(selectedOption.value !== "") {
            shippingPrice = parseFloat(selectedOption.getAttribute('data-' + deliveryType)) || 0;
        }
        
        document.getElementById('total_display').innerText = (basePrice + shippingPrice);
    }
    function updateDelivery() { calculateTotal(); }
</script>

</body>
</html>
