<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب</title>
    <!-- Tailwind CSS لتنسيق زر الرجوع والعناصر الحديثة -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Tajawal', sans-serif; }
        .checkout-card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-label { font-weight: bold; color: #333; }
        .btn-confirm { background-color: #28a745; color: white; padding: 12px; font-weight: bold; border: none; }
        .btn-confirm:hover { background-color: #218838; }

        /* إخفاء شريط جوجل العلوي وتثبيت الصفحة لمنع الاهتزاز عند الترجمة */
        .goog-te-banner-frame.skiptranslate {
            display: none !important;
        }
        body {
            top: 0px !important;
        }
        /* تنسيق عنصر اختيار اللغة ليطابق تصميم الموقع */
        .goog-te-combo {
            padding: 6px 12px;
            border-radius: 9999px;
            border: 1px solid #d1d5db;
            outline: none;
            background-color: white;
            font-size: 14px;
            color: #374151;
        }
    </style>
</head>
<body class="p-3">

<!-- شريط علوي صغير لأداة الترجمة -->
<div class="container mt-2 mb-3">
    <div class="d-flex justify-content-end">
        <div id="google_translate_element"></div>
    </div>
</div>

<div class="container mt-2">
    <div class="row justify-content-center">
        <div class="col-md-6 checkout-card">
            
            <!-- زر العودة إلى المتجر -->
            <div class="mb-4">
                <a href="/shop" class="inline-flex items-center gap-2 text-indigo-600 hover:text-indigo-800 font-semibold transition duration-200 text-decoration-none">
                    <i class="fas fa-arrow-right"></i> العودة إلى المتجر
                </a>
            </div>

            <h4 class="text-center mb-4">معلومات التوصيل</h4>
            
            <!-- تم ضبط الفورم ليرسل البيانات بشكل صحيح إلى /submit-order -->
            <form action="/submit-order" method="POST">
                
                <!-- حقل مخفي لبيانات السلة -->
                <input type="hidden" name="cart_data" id="cart_data">
                
                <!-- الحقل المخفي لسعر التوصيل -->
                <input type="hidden" name="delivery_price" id="delivery_price_input" value="0">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">الاسم الكامل</label>
                        <input type="text" name="customer_name" class="form-control" required placeholder="أدخل اسمك">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">رقم الهاتف</label>
                        <input type="tel" name="phone" class="form-control" required placeholder="0XXXXXXXXX">
                    </div>
                </div>

                <!-- خانة اختيار الكمية المدمجة -->
                <div class="mb-3">
                    <label for="quantity" class="form-label">الكمية:</label>
                    <input type="number" id="quantity" name="quantity" value="1" min="1" max="100" class="form-control" oninput="calculateTotal()" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">الولاية</label>
                    <select name="wilaya" class="form-select" id="wilaya" onchange="updateDelivery()" required>
                        <option value="">-- اختر الولاية --</option>
                        {% for rate in rates %}
                        <option value="{{ rate.wilaya_name }}" data-home="{{ rate.home_price }}" data-office="{{ rate.office_price }}">
                            {{ rate.wilaya_name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- خانة البلدية -->
                <div class="mb-3">
                    <label class="form-label">البلدية</label>
                    <input type="text" name="baladiya" class="form-control" required placeholder="أدخل اسم البلدية (مثلاً: الحراش)">
                </div>

                <div class="mb-3">
                    <label class="form-label">نوع التوصيل</label>
                    <select name="delivery_type" class="form-select" id="delivery_type" onchange="calculateTotal()" required>
                        <option value="home">توصيل للمنزل</option>
                        <option value="office">توصيل للمكتب</option>
                    </select>
                </div>

                <!-- عرض المجموع الكلي -->
                <div class="p-3 mb-3 bg-light rounded text-center">
                    <h5>المجموع الكلي: <span id="total_display" class="text-primary">0</span> دج</h5>
                </div>

                <button type="submit" class="btn btn-confirm w-100">تأكيد الطلب</button>
            </form>
        </div>
    </div>
</div>

<!-- سكربت الترجمة من جوجل -->
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'ar',
    includedLanguages: 'ar,en,fr,es',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE
  }, 'google_translate_element');
}
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script>
    // 1. جلب بيانات السلة عند تحميل الصفحة
    window.onload = function() {
        let cart = localStorage.getItem('cart');
        document.getElementById('cart_data').value = cart;
        calculateTotal(); // حساب السعر عند التحميل
    };

    // 2. دالة حساب الإجمالي وتحديث الحقول بناءً على السعر والكمية والتوصيل
    function calculateTotal() {
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        let basePrice = cart.reduce((total, item) => total + parseFloat(item.price), 0);
        
        // قراءة قيمة الكمية المدخلة (إذا لم تكن صالحة تكون 1)
        let quantity = parseInt(document.getElementById('quantity').value) || 1;
        
        const wilayaSelect = document.getElementById('wilaya');
        const deliveryType = document.getElementById('delivery_type').value;
        const selectedOption = wilayaSelect.options[wilayaSelect.selectedIndex];
        
        let shippingPrice = 0;
        if(selectedOption.value !== "") {
            shippingPrice = parseFloat(selectedOption.getAttribute('data-' + deliveryType)) || 0;
        }
        
        // حساب المجموع: (سعر المنتجات الأساسي × الكمية) + سعر التوصيل
        let finalTotal = (basePrice * quantity) + shippingPrice;
        
        document.getElementById('total_display').innerText = finalTotal;
        document.getElementById('delivery_price_input').value = shippingPrice;
    }

    function updateDelivery() { 
        calculateTotal(); 
    }
</script>

</body>
</html>
