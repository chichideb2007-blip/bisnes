<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .option-chip {
            border: 2px solid #e5e7eb;
            background-color: #fff;
            color: #374151;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .option-chip:hover {
            border-color: #6366f1;
            background-color: #f8fafc;
        }
        .option-chip.active {
            background-color: #6366f1 !important;
            color: #fff !important;
            border-color: #6366f1 !important;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between py-8">

    <main class="max-w-xl mx-auto px-4 w-full">
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
            <h3 class="text-xl font-black text-center mb-6 text-gray-900">معلومات التوصيل وتأكيد الطلب</h3>
            
            <!-- ملخص السلة -->
            <div class="mb-6 bg-gray-50 p-4 rounded-2xl border border-gray-100">
                <h4 class="font-bold text-gray-700 mb-3 text-sm">منتجات السلة:</h4>
                <div id="checkout_cart_summary" class="space-y-4"></div>
                <div class="mt-4 pt-3 border-t border-gray-200 flex justify-between items-center">
                    <span class="font-bold text-gray-600">مجموع المنتجات:</span>
                    <span class="text-indigo-600 font-black text-lg"><span id="checkout_total_price">0</span> دج</span>
                </div>
            </div>

            <form action="/submit-order" method="POST" onsubmit="prepareCheckoutData()">
                <input type="hidden" name="cart_data" id="cart_data_input">

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block font-bold text-sm mb-1 text-gray-700">الاسم</label>
                        <input type="text" name="customer_name" class="w-full border rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-600 bg-gray-50" required placeholder="الاسم">
                    </div>
                    <div>
                        <label class="block font-bold text-sm mb-1 text-gray-700">اللقب</label>
                        <input type="text" name="customer_last_name" class="w-full border rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-600 bg-gray-50" required placeholder="اللقب">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block font-bold text-sm mb-1 text-gray-700">رقم الهاتف</label>
                    <input type="tel" name="phone" class="w-full border rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-600 bg-gray-50" required placeholder="0XXXXXXXXX">
                </div>

                <div class="mb-4">
                    <label class="block font-bold text-sm mb-1 text-gray-700">البلد</label>
                    <select id="country" name="country" class="w-full border rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-600 bg-gray-50" onchange="toggleCountryFields()" required>
                        <option value="" disabled selected>-- اختر الدولة --</option>
                        <option value="algeria">الجزائر 🇩🇿</option>
                        <option value="jordan">الأردن 🇯🇴</option>
                    </select>
                </div>

                <div class="mb-4" id="algeria_section">
                    <label class="block font-bold text-sm mb-1 text-gray-700">الولاية</label>
                    <select id="wilaya" name="wilaya" class="w-full border rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-600 bg-gray-50" onchange="calculateShipping()">
                        <option value="">-- اختر الولاية --</option>
                        {% for wilaya in rates %}
                            <option value="{{ wilaya.id }}" 
                                    data-home="{{ wilaya.home_price }}" 
                                    data-office="{{ wilaya.office_price }}">
                                {{ wilaya.wilaya_name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4" id="baladiya_container">
                    <label class="block font-bold text-sm mb-1 text-gray-700">البلدية</label>
                    <input type="text" name="baladia" id="baladiya_input" class="w-full border rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-600 bg-gray-50" placeholder="أدخل اسم البلدية">
                </div>

                <div class="mb-4">
                    <label class="block font-bold text-sm mb-1 text-gray-700">العنوان بالتفصيل</label>
                    <input type="text" name="address" class="w-full border rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-600 bg-gray-50" placeholder="الحي أو الشارع" required>
                </div>

                <div class="mb-4">
                    <label class="block font-bold text-sm mb-1 text-gray-700">طريقة التوصيل</label>
                    <select id="delivery_type" name="delivery_type" class="w-full border rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-600 bg-gray-50" onchange="calculateShipping()" required>
                        <option value="home">توصيل للمنزل</option>
                        <option value="office">توصيل للمكتب</option>
                    </select>
                </div>

                <input type="hidden" name="delivery_price" id="delivery_price_input" value="0">

                <div class="bg-gray-50 p-4 rounded-2xl mb-6 border border-gray-100 space-y-2">
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-500 font-bold">سعر التوصيل:</span>
                        <span class="font-bold text-gray-800"><span id="shipping_display">0</span> دج</span>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-gray-200">
                        <span class="font-bold text-gray-700">المجموع الكلي مع التوصيل:</span>
                        <span class="text-xl font-black text-indigo-600"><span id="grand_total_display">0</span> دج</span>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl shadow-lg transition-all">تأكيد الطلب نهائياً</button>
                    <a href="/cart" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-6 py-3.5 rounded-2xl text-center">رجوع</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        let baseProductsTotal = 0;

        // دالة لفصل النصوص الملتصقة وتحويلها لأزرار مستقلة (Chips)
        function renderOptionChips(optionsStr, currentSelected, type, itemIndex) {
            if (!optionsStr || optionsStr.trim() === "" || optionsStr === "NULL") return '';
            
            // تقسيم النص بالفواصل العربية أو الإنجليزية
            let options = optionsStr.split(/[,،]/);
            let labelText = type === 'color' ? 'اللون:' : 'المقاس:';
            
            let html = `<div class="mt-2">
                <span class="block text-xs font-bold text-gray-500 mb-1">${labelText}</span>
                <div class="flex flex-wrap gap-1.5">`;
            
            options.forEach(opt => {
                let val = opt.trim();
                if(val !== "") {
                    // إذا لم يكن هناك اختيار مخزن مسبقاً، نختار الخيار الأول افتراضياً
                    let isSelected = (currentSelected === val) || (!currentSelected && options.indexOf(opt) === 0);
                    if (isSelected && !currentSelected) {
                        updateCartOptionSilent(itemIndex, type, val);
                    }
                    let activeClass = isSelected ? 'active' : '';

                    html += `<button type="button" class="option-chip ${activeClass}" onclick="updateCartOption(${itemIndex}, '${type}', '${val}', this)">${val}</button>`;
                }
            });
            
            html += `</div></div>`;
            return html;
        }

        // تحديث الاختيار في الـ localStorage بصمت عند التحميل الأول
        function updateCartOptionSilent(index, type, value) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart[index]) {
                cart[index][type] = value;
                localStorage.setItem('cart', JSON.stringify(cart));
            }
        }

        // تحديث الاختيار عند الضغط على الزر من طرف الزبون
        window.updateCartOption = function(index, type, value, btnElement) {
            let container = btnElement.parentElement;
            container.querySelectorAll('.option-chip').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart[index]) {
                cart[index][type] = value;
                localStorage.setItem('cart', JSON.stringify(cart));
            }
        }

        function loadCheckoutCart() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let container = document.getElementById('checkout_cart_summary');
            container.innerHTML = '';

            let total = 0;
            cart.forEach((item, index) => {
                let price = parseFloat(item.price) || 0;
                let qty = parseInt(item.quantity) || 1;
                let itemTotal = price * qty;
                total += itemTotal;

                let imgSrc = item['product-images'] || item.image || 'https://via.placeholder.com/60';
                
                // الاعتماد على الحقول الكاملة (colors / sizes) وإن لم تتوفر نأخذ (color / size)
                let colorsSource = item.colors || item.color || '';
                let sizesSource = item.sizes || item.size || '';

                container.innerHTML += `
                    <div class="flex flex-col gap-2 bg-white p-3 rounded-xl border border-gray-100">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <img src="${imgSrc}" style="width: 55px; height: 55px; object-fit: cover;" class="rounded-lg border">
                                <div>
                                    <h5 class="font-bold text-gray-800 text-sm">${item.name}</h5>
                                    <p class="text-xs text-gray-500">الكمية: ${qty}</p>
                                </div>
                            </div>
                            <span class="font-black text-indigo-600 text-sm">${itemTotal} دج</span>
                        </div>
                        
                        <!-- توليد الأزرار المفصولة للألوان والمقاسات -->
                        ${renderOptionChips(colorsSource, item.color, 'color', index)}
                        ${renderOptionChips(sizesSource, item.size, 'size', index)}
                    </div>
                `;
            });

            baseProductsTotal = total;
            document.getElementById('checkout_total_price').innerText = total;
            calculateShipping();
        }

        function toggleCountryFields() {
            const country = document.getElementById('country').value;
            const algeriaSection = document.getElementById('algeria_section');
            const wilayaSelect = document.getElementById('wilaya');
            const baladiyaContainer = document.getElementById('baladiya_container');

            if (country === 'algeria') {
                algeriaSection.classList.remove('hidden');
                wilayaSelect.setAttribute('required', 'required');
                if(baladiyaContainer) baladiyaContainer.style.display = 'block';
            } else {
                algeriaSection.classList.add('hidden');
                wilayaSelect.removeAttribute('required');
                if(baladiyaContainer) baladiyaContainer.style.display = 'none';
            }
            calculateShipping();
        }

        function calculateShipping() {
            const country = document.getElementById('country').value;
            let shippingPrice = 0;

            if (country === 'algeria') {
                const wilayaSelect = document.getElementById('wilaya');
                const deliveryType = document.getElementById('delivery_type').value;
                const selectedOption = wilayaSelect.options[wilayaSelect.selectedIndex];
                
                if (selectedOption && selectedOption.value !== "") {
                    shippingPrice = (deliveryType === 'home') ? parseFloat(selectedOption.dataset.home || 0) : parseFloat(selectedOption.dataset.office || 0);
                }
            }

            document.getElementById('shipping_display').innerText = shippingPrice;
            document.getElementById('delivery_price_input').value = shippingPrice;
            document.getElementById('grand_total_display').innerText = baseProductsTotal + shippingPrice;
        }

        function prepareCheckoutData() {
            let cart = localStorage.getItem('cart') || '[]';
            document.getElementById('cart_data_input').value = cart;
            localStorage.removeItem('cart');
        }

        loadCheckoutCart();
    </script>
</body>
</html>
