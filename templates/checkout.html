<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .checkout-card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        .form-label { font-weight: bold; color: #333; }
        .price-box { background: #e9ecef; padding: 15px; border-radius: 10px; margin: 20px 0; }
        .btn-confirm { background-color: #198754; color: white; padding: 12px; font-weight: bold; border: none; border-radius: 8px; flex-grow: 1; }
        .btn-back { background-color: #6c757d; color: white; padding: 12px; font-weight: bold; border: none; border-radius: 8px; text-decoration: none; text-align: center; }

        .goog-te-banner-frame.skiptranslate { display: none !important; }
        body { top: 0px !important; }
        .goog-te-combo {
            padding: 6px 12px;
            border-radius: 9999px;
            border: 1px solid #d1d5db;
            outline: none;
            background-color: white;
            font-size: 14px;
            color: #374151;
        }
    </style>
</head>
<body>

<div class="container mb-3" style="max-width: 600px;">
    <div class="d-flex justify-content-end">
        <div id="google_translate_element"></div>
    </div>
</div>

<div class="container mt-2">
    <div class="checkout-card">
        <h3 class="text-center mb-4">معلومات الطلب</h3>
        
        <!-- صندوق عرض المنتج الفردي أو قائمة السلة -->
        <div class="card p-3 mb-3 border-0 bg-light" id="product_info_box">
            {% if product %}
                <h5>المنتج: <span class="text-indigo">{{ product.name }}</span></h5>
                <p class="mb-0 text-danger fw-bold">السعر للقطعة: <span id="product_unit_price">{{ product.price }}</span> دج</p>
            {% else %}
                <h5>المنتجات في السلة:</h5>
                <ul id="cart_items_list" class="mb-2 ps-3"></ul>
                <p class="mb-0 text-danger fw-bold">إجمالي المنتجات: <span id="cart_base_price_display">0</span> دج</p>
            {% endif %}
        </div>

        <form action="/submit-order" method="POST" onsubmit="prepareOrderSubmission()">
            {% if product %}
                <input type="hidden" name="product_id" value="{{ product.id }}">
            {% endif %}
            
            <!-- حقل مخفي لبيانات السلة -->
            <input type="hidden" name="cart_data" id="cart_data_input" value="">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">الاسم</label>
                    <input type="text" name="customer_name" class="form-control" required placeholder="الاسم">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">اللقب</label>
                    <input type="text" name="customer_last_name" class="form-control" required placeholder="اللقب">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">رقم الهاتف</label>
                <input type="tel" name="phone" class="form-control" required placeholder="0XXXXXXXXX">
            </div>

            <!-- خانة البلد -->
            <div class="mb-3">
                <label for="country" class="form-label">البلد</label>
                <select id="country" name="country" class="form-select" onchange="toggleCountryFields()" required>
                    <option value="" disabled selected>-- اختر الدولة --</option>
                    <option value="algeria">الجزائر 🇩🇿</option>
                    <option value="jordan">الأردن 🇯🇴</option>
                </select>
            </div>

            <!-- خانة الكمية (تظهر فقط للشراء المباشر، وتختفي إذا كان الطلب من السلة لأن السلة تحتوي على كمياتها مسبقاً) -->
            <div class="mb-3" id="quantity_container">
                <label for="quantity" class="form-label">الكمية</label>
                <input type="number" id="quantity" name="quantity" class="form-control" value="1" min="1" oninput="calculateTotal()" required>
            </div>

            <!-- خانة ولايات الجزائر -->
            <div class="mb-3" id="algeria_section">
                <label class="form-label">الولاية</label>
                <select id="wilaya" name="wilaya" class="form-select" onchange="calculateTotal()">
                    <option value="">-- اختر الولاية --</option>
                    {% for wilaya in rates %}
                        <option value="{{ wilaya.id }}" 
                                data-home="{{ wilaya.home_price }}" 
                                data-office="{{ wilaya.office_price }}">
                            {{ wilaya.wilaya_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- خانة محافظات الأردن -->
            <div class="mb-3 d-none" id="jordan_section">
                <label for="jordan_region" class="form-label">المحافظة والمنطقة (الأردن)</label>
                <select id="jordan_region" name="jordan_region" class="form-select" onchange="calculateTotal()" style="color: #000 !important; background-color: #fff !important;" required>
                    <option value="" disabled selected style="color: #000;">-- اختر المحافظة والمنطقة --</option>
                    {% for rate in jordan_rates %}
                        <option value="{{ rate.id }}" 
                                data-home="{{ rate.home_price }}" 
                                data-office="{{ rate.office_price }}"
                                style="color: #000 !important; background-color: #fff !important;">
                            {{ rate.governorate_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- حاوية خانة البلدية -->
            <div class="mb-3" id="baladiya_container">
                <label class="form-label">البلدية</label>
                <input type="text" name="baladia" id="baladiya_input" class="form-control" placeholder="أدخل اسم البلدية">
            </div>

            <div class="mb-3">
                <label class="form-label">العنوان بالتفصيل</label>
                <input type="text" name="address" class="form-control" placeholder="الحي أو الشارع" required>
            </div>

            <div class="mb-3" id="delivery_type_box">
                <label class="form-label">طريقة التوصيل</label>
                <select id="delivery_type" name="delivery_type" class="form-select" onchange="calculateTotal()" required>
                    <option value="home">توصيل للمنزل</option>
                    <option value="office">توصيل للمكتب</option>
                </select>
            </div>

            <input type="hidden" name="delivery_price" id="delivery_price_input" value="0">

            <div class="price-box">
                <h5>سعر التوصيل: <span id="shipping_display">0</span></h5>
                <h4 class="text-primary mt-2">المجموع الكلي: <span id="total_display">0</span></h4>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn-confirm">تأكيد الطلب</button>
                <a href="/store2" class="btn-back">رجوع</a>
            </div>
        </form>
    </div>
</div>

<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'ar',
    includedLanguages: 'ar,en,fr,es',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE
  }, 'google_translate_element');
}
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script>
    // تحديد ما إذا كان المنتج مفرد أم من السلة
    let isSingleProduct = {% if product %}true{% else %}false{% endif %};
    let basePrice = isSingleProduct ? parseFloat("{{ product.price }}") : 0;
    
    // محاولة جلب السلة إذا لم يكن منتجاً مفرداً
    // نحتاج لمعرفة اسم المتجر الحالي لتحديد المفتاح الصحيح للسلة
    const pathSegments = window.location.pathname.split('/');
    // يمكنك تعديل طريقة استخراج اسم المتجر حسب تخزينك أو الاعتماد على LocalStorage الموحد
    let cartDataList = [];
    
    if (!isSingleProduct) {
        // البحث عن أي سلة مخزنة في الـ localStorage
        for (let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if (key && key.startsWith('cart_')) {
                try {
                    let items = JSON.parse(localStorage.getItem(key));
                    if (Array.isArray(items) && items.length > 0) {
                        cartDataList = items;
                        break;
                    }
                } catch(e) {}
            }
        }
        
        // حساب إجمالي أسعار السلة
        let listContainer = document.getElementById('cart_items_list');
        cartDataList.forEach(item => {
            basePrice += parseFloat(item.price || 0);
            if (listContainer) {
                let li = document.createElement('li');
                li.innerText = `${item.name} - ${item.price} دج`;
                listContainer.appendChild(li);
            }
        });
        
        document.getElementById('cart_base_price_display').innerText = basePrice;
        // إخفاء حقل الكمية لأن السلة تحتوى على منتجاتها مباشرة
        document.getElementById('quantity_container').style.display = 'none';
        document.getElementById('quantity').value = 1;
    }

    // تعبئة حقل بيانات السلة عند إرسال النموذج وتفريغ السلة
    function prepareOrderSubmission() {
        if (!isSingleProduct && cartDataList.length > 0) {
            document.getElementById('cart_data_input').value = JSON.stringify(cartDataList);
            // تفريغ السلات بعد الطلب الناجح
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                if (key && key.startsWith('cart_')) {
                    localStorage.removeItem(key);
                }
            }
        }
        calculateTotal();
    }

    function toggleCountryFields() {
        const country = document.getElementById('country').value;
        const algeriaSection = document.getElementById('algeria_section');
        const jordanSection = document.getElementById('jordan_section');
        const wilayaSelect = document.getElementById('wilaya');
        const jordanSelect = document.getElementById('jordan_region');
        const baladiyaContainer = document.getElementById('baladiya_container');
        const baladiyaInput = document.getElementById('baladiya_input');

        if (country === 'algeria') {
            algeriaSection.classList.remove('d-none');
            jordanSection.classList.add('d-none');
            wilayaSelect.setAttribute('required', 'required');
            jordanSelect.removeAttribute('required');
            jordanSelect.value = "";

            if (baladiyaContainer) {
                baladiyaContainer.style.display = "block";
                if (baladiyaInput) baladiyaInput.setAttribute('required', 'required');
            }
        } else if (country === 'jordan') {
            algeriaSection.classList.add('d-none');
            jordanSection.classList.remove('d-none');
            jordanSelect.setAttribute('required', 'required');
            wilayaSelect.removeAttribute('required');
            wilayaSelect.value = "";

            if (baladiyaContainer) {
                baladiyaContainer.style.display = "none";
                if (baladiyaInput) {
                    baladiyaInput.removeAttribute('required');
                    baladiyaInput.value = "";
                }
            }
        }
        calculateTotal();
    }

    function calculateTotal() {
        const country = document.getElementById('country').value;
        const shippingDisplay = document.getElementById('shipping_display');
        const totalDisplay = document.getElementById('total_display');
        const deliveryPriceInput = document.getElementById('delivery_price_input');
        const quantity = isSingleProduct ? (parseInt(document.getElementById('quantity').value) || 1) : 1;

        let shippingPrice = 0;

        if (country === 'algeria') {
            const wilayaSelect = document.getElementById('wilaya');
            const deliveryType = document.getElementById('delivery_type').value;
            const selectedOption = wilayaSelect.options[wilayaSelect.selectedIndex];
            
            if (selectedOption && selectedOption.value !== "") {
                shippingPrice = (deliveryType === 'home') ? parseFloat(selectedOption.dataset.home || 0) : parseFloat(selectedOption.dataset.office || 0);
            }
        } else if (country === 'jordan') {
            const jordanSelect = document.getElementById('jordan_region');
            const deliveryType = document.getElementById('delivery_type').value;
            const selectedJordanOption = jordanSelect.options[jordanSelect.selectedIndex];
            
            if (selectedJordanOption && selectedJordanOption.value !== "") {
                shippingPrice = (deliveryType === 'home') ? parseFloat(selectedJordanOption.dataset.home || 0) : parseFloat(selectedJordanOption.dataset.office || 0);
            }
        }
        
        let productsTotal = basePrice * quantity;
        let finalTotal = productsTotal + shippingPrice;

        shippingDisplay.innerText = shippingPrice;
        totalDisplay.innerText = finalTotal;
        deliveryPriceInput.value = shippingPrice;
    }

    // تشغيل الحساب أوليّاً عند التحميل
    window.onload = function() {
        calculateTotal();
    };
</script>

</body>
</html>
