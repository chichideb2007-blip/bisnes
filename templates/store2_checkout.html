<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام طلب المطعم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .checkout-card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        .form-label { font-weight: bold; color: #333; }
        .price-box { background: #e9ecef; padding: 15px; border-radius: 10px; margin: 20px 0; }
        .btn-confirm { background-color: #d97706; color: white; padding: 12px; font-weight: bold; border: none; border-radius: 8px; flex-grow: 1; cursor: pointer; }
        .btn-back { background-color: #6c757d; color: white; padding: 12px; font-weight: bold; border: none; border-radius: 8px; text-decoration: none; text-align: center; display: inline-block; }

        .goog-te-banner-frame.skiptranslate { display: none !important; }
        body { top: 0px !important; }
        .goog-te-combo {
            padding: 6px 12px;
            border-radius: 9999px;
            border: 1px solid #d1d5db;
            outline: none;
            background-color: white;
            font-size: 14px;
            color: #374151;
        }
    </style>
</head>
<body>

<div class="container mb-3" style="max-width: 600px;">
    <div class="d-flex justify-content-end">
        <div id="google_translate_element"></div>
    </div>
</div>

<div class="container mt-2">
    <div class="checkout-card">
        <h3 class="text-center mb-4">إتمام طلب سلة وجبات المطعم</h3>
        
        <div class="card p-3 mb-3 border-0 bg-light" id="product_info_box">
            <h5>نوع الطلب: <span id="display_order_type" class="text-amber-600 fw-bold">توصيل للمنزل</span></h5>
            <div id="table_info_box" class="mt-1 text-danger fw-bold" style="display: none;">رقم الطاولة: <span id="display_table_number"></span></div>
            <div id="cart_items_summary" class="mt-2 text-muted small">جاري تحميل الوجبات...</div>
        </div>

        <form id="checkout-form" onsubmit="submitOrder(event)">
            <input type="hidden" name="order_type" id="order_type_input" value="delivery">
            <input type="hidden" name="table_number" id="table_number_input_hidden" value="">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">الاسم</label>
                    <input type="text" id="customer-name" name="customer_name" class="form-control" required placeholder="أدخل الاسم">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">اللقب</label>
                    <input type="text" id="customer-last-name" name="customer_last_name" class="form-control" required placeholder="أدخل اللقب">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">رقم الهاتف</label>
                <input type="tel" id="customer-phone" name="phone" class="form-control" required placeholder="0XXXXXXXXX">
            </div>

            <div id="delivery_sections_wrapper">
                <div class="mb-3">
                    <label for="country" class="form-label">البلد</label>
                    <select id="country" name="country" class="form-select" onchange="toggleCountryFields()">
                        <option value="" disabled selected>-- اختر الدولة --</option>
                        <option value="algeria">الجزائر 🇩🇿</option>
                        <option value="jordan">الأردن 🇯🇴</option>
                    </select>
                </div>

                <div class="mb-3" id="algeria_section">
                    <label class="form-label">الولاية / المدينة</label>
                    <select id="wilaya-select" name="wilaya" class="form-select" onchange="calculateTotal()">
                        <option value="">-- اختر الولاية --</option>
                        {% for wilaya in rates %}
                            <option value="{{ wilaya.id }}" 
                                    data-home="{{ wilaya.home_price }}" 
                                    data-office="{{ wilaya.office_price }}">
                                {{ wilaya.wilaya_name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3 d-none" id="jordan_section">
                    <label for="jordan_region" class="form-label">المحافظة والمنطقة (الأردن)</label>
                    <select id="jordan_region" name="jordan_region" class="form-select" onchange="calculateTotal()">
                        <option value="" disabled selected>-- اختر المحافظة والمنطقة --</option>
                        {% for rate in jordan_rates %}
                            <option value="{{ rate.id }}" 
                                    data-home="{{ rate.home_price }}" 
                                    data-office="{{ rate.office_price }}">
                                {{ rate.governorate_name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3" id="baladiya_container">
                    <label class="form-label">البلدية</label>
                    <input type="text" name="baladia" id="baladiya_input" class="form-control" placeholder="أدخل اسم البلدية">
                </div>

                <div class="mb-3">
                    <label class="form-label">العنوان بالتفصيل (توصيل الوجبة ساخنة)</label>
                    <input type="text" name="address" id="address_input" class="form-control" placeholder="رقم الحي، الشارع، أو علامة مميزة">
                </div>

                <div class="mb-3" id="delivery_type_box">
                    <label class="form-label">طريقة الاستلام</label>
                    <select id="delivery-type" name="delivery_type" class="form-select" onchange="calculateTotal()">
                        <option value="home">توصيل للمنزل (دليفري)</option>
                        <option value="office">استلام من المطعم / المكتب</option>
                    </select>
                </div>
            </div>

            <input type="hidden" name="delivery_price" id="delivery_price_input" value="0">

            <div class="price-box">
                <h5>إجمالي سعر الوجبات: <span id="products_total_display">0</span> دج</h5>
                <div id="shipping_box">
                    <h5>سعر التوصيل: <span id="shipping_display">0</span> دج</h5>
                </div>
                <h4 class="text-danger mt-2">المجموع الكلي: <span id="total-price">0</span> دج</h4>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn-confirm">تأكيد الطلب الآن</button>
                <a href="/store2" class="btn-back">رجوع للقائمة</a>
            </div>
        </form>
    </div>
</div>

<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'ar',
    includedLanguages: 'ar,en,fr,es',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE
  }, 'google_translate_element');
}
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script>
    let cartTotalBase = 0;
    let isDineIn = false;

    window.addEventListener('DOMContentLoaded', () => {
        let cart = JSON.parse(localStorage.getItem('store2_cart')) || [];
        let summaryContainer = document.getElementById('cart_items_summary');
        
        let orderType = localStorage.getItem('store2_order_type') || 'توصيل للمنزل';
        let tableNumber = localStorage.getItem('store2_table_number') || '';

        let displayOrderTypeEl = document.getElementById('display_order_type');
        let tableInfoBox = document.getElementById('table_info_box');
        let displayTableNumEl = document.getElementById('display_table_number');
        let deliverySectionsWrapper = document.getElementById('delivery_sections_wrapper');
        let shippingBox = document.getElementById('shipping_box');
        let orderTypeInput = document.getElementById('order_type_input');
        let tableNumberInputHidden = document.getElementById('table_number_input_hidden');

        if (orderType.includes('داخل المطعم')) {
            isDineIn = true;
            displayOrderTypeEl.innerText = "داخل المطعم (طاولة رقم " + tableNumber + ")";
            tableInfoBox.style.display = 'block';
            displayTableNumEl.innerText = tableNumber;
            
            deliverySectionsWrapper.style.display = 'none';
            shippingBox.style.display = 'none';

            document.getElementById('country').removeAttribute('required');
            document.getElementById('address_input').removeAttribute('required');

            orderTypeInput.value = 'dine_in';
            tableNumberInputHidden.value = tableNumber;
        } else {
            isDineIn = false;
            displayOrderTypeEl.innerText = "توصيل للمنزل";
            tableInfoBox.style.display = 'none';
            deliverySectionsWrapper.style.display = 'block';
            shippingBox.style.display = 'block';

            document.getElementById('country').setAttribute('required', 'required');
            document.getElementById('address_input').setAttribute('required', 'required');

            orderTypeInput.value = 'delivery';
            tableNumberInputHidden.value = '';
        }

        if (cart.length > 0) {
            let htmlList = "<ul class='mb-0 ps-3'>";
            let calculatedCartTotal = 0;
            
            cart.forEach(item => {
                let itemPrice = parseFloat(item.price || 0);
                let itemQty = parseInt(item.quantity || 1);
                let itemTotal = itemPrice * itemQty;
                calculatedCartTotal += itemTotal;
                htmlList += `<li>${item.name} (الكمية: ${itemQty}) - ${itemTotal} دج</li>`;
            });
            htmlList += "</ul>";
            
            if(summaryContainer) summaryContainer.innerHTML = htmlList;
            cartTotalBase = calculatedCartTotal;
        } else {
            if(summaryContainer) summaryContainer.innerHTML = "سلة وجبات فارغة!";
            cartTotalBase = 0;
        }
        calculateTotal();
    });

    function toggleCountryFields() {
        const country = document.getElementById('country').value;
        const algeriaSection = document.getElementById('algeria_section');
        const jordanSection = document.getElementById('jordan_section');
        const wilayaSelect = document.getElementById('wilaya-select');
        const jordanSelect = document.getElementById('jordan_region');
        const baladiyaContainer = document.getElementById('baladiya_container');
        const baladiyaInput = document.getElementById('baladiya_input');

        if (country === 'algeria') {
            algeriaSection.classList.remove('d-none');
            jordanSection.classList.add('d-none');
            wilayaSelect.setAttribute('required', 'required');
            jordanSelect.removeAttribute('required');
            jordanSelect.value = "";

            if (baladiyaContainer) {
                baladiyaContainer.style.display = "block";
                if (baladiyaInput) baladiyaInput.setAttribute('required', 'required');
            }
        } else if (country === 'jordan') {
            algeriaSection.classList.add('d-none');
            jordanSection.classList.remove('d-none');
            jordanSelect.setAttribute('required', 'required');
            wilayaSelect.removeAttribute('required');
            wilayaSelect.value = "";

            if (baladiyaContainer) {
                baladiyaContainer.style.display = "none";
                if (baladiyaInput) {
                    baladiyaInput.removeAttribute('required');
                    baladiyaInput.value = "";
                }
            }
        }
        calculateTotal();
    }

    function calculateTotal() {
        const productsTotalDisplay = document.getElementById('products_total_display');
        const shippingDisplay = document.getElementById('shipping_display');
        const totalDisplay = document.getElementById('total-price');
        const deliveryPriceInput = document.getElementById('delivery_price_input');
        
        let shippingPrice = 0;

        if (!isDineIn) {
            const country = document.getElementById('country').value;
            if (country === 'algeria') {
                const wilayaSelect = document.getElementById('wilaya-select');
                const deliveryType = document.getElementById('delivery-type').value;
                const selectedOption = wilayaSelect.options[wilayaSelect.selectedIndex];
                
                if (selectedOption && selectedOption.value !== "") {
                    shippingPrice = (deliveryType === 'home') ? parseFloat(selectedOption.dataset.home || 0) : parseFloat(selectedOption.dataset.office || 0);
                }
            } else if (country === 'jordan') {
                const jordanSelect = document.getElementById('jordan_region');
                const deliveryType = document.getElementById('delivery-type').value;
                const selectedJordanOption = jordanSelect.options[jordanSelect.selectedIndex];
                
                if (selectedJordanOption && selectedJordanOption.value !== "") {
                    shippingPrice = (deliveryType === 'home') ? parseFloat(selectedJordanOption.dataset.home || 0) : parseFloat(selectedJordanOption.dataset.office || 0);
                }
            }
        }
        
        let finalTotal = cartTotalBase + shippingPrice;

        if(productsTotalDisplay) productsTotalDisplay.innerText = cartTotalBase;
        if(shippingDisplay) shippingDisplay.innerText = shippingPrice;
        if(totalDisplay) totalDisplay.innerText = finalTotal;
        if(deliveryPriceInput) deliveryPriceInput.value = shippingPrice;
    }

    // دالة إرسال الطلبية بالطريقة المختصرة والنظيفة لمنع أخطاء الـ Payload
    function submitOrder(event) {
        event.preventDefault(); // منع الإرسال العادي للصفحة

        const orderData = {
            customer_name: document.getElementById('customer-name').value + ' ' + document.getElementById('customer-last-name').value,
            phone: document.getElementById('customer-phone').value,
            wilaya: document.getElementById('wilaya-select').value,
            baladiya: document.getElementById('baladiya_input').value,
            delivery_type: document.getElementById('delivery-type').value,
            product_summary: document.getElementById('cart_items_summary').innerText,
            total_price: document.getElementById('total-price').innerText,
            order_type: document.getElementById('order_type_input').value,
            table_number: document.getElementById('table_number_input_hidden').value
        };

        fetch('/submit-order', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(orderData)
        })
        .then(response => response.json())
        .then(data => {
            if(data.success || data.status === 'success') {
                alert('تم تأكيد طلبيتك بنجاح!');
                localStorage.removeItem('store2_cart');
                window.location.href = '/store2'; // العودة لصفحة المتجر أو القائمة
            } else {
                alert('حدث خطأ، يرجى المحاولة مرة أخرى.');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('تم إرسال الطلب أو حدث خطأ في الاتصال بالسيرفر.');
        });
    }
</script>

</body>
</html>
