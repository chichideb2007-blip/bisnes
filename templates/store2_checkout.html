<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام طلب المطعم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #fffbeb; font-family: 'Segoe UI', sans-serif; padding: 20px; color: #1f2937; }
        .checkout-card { background: white; border-radius: 24px; padding: 30px; box-shadow: 0 10px 25px rgba(217, 119, 6, 0.08); max-width: 600px; margin: auto; border: 1px solid #fef3c7; }
        .form-label { font-weight: bold; color: #374151; font-size: 0.9rem; }
        .price-box { background: #fffbeb; border: 1px solid #fde68a; padding: 20px; border-radius: 16px; margin: 20px 0; }
        .btn-confirm { background-color: #d97706; color: white; padding: 14px; font-weight: bold; border: none; border-radius: 14px; flex-grow: 1; transition: background-color 0.2s; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.2); }
        .btn-confirm:hover { background-color: #b45309; }
        .btn-back { background-color: #f3f4f6; color: #4b5563; padding: 14px; font-weight: bold; border: none; border-radius: 14px; text-decoration: none; text-align: center; transition: background-color 0.2s; }
        .btn-back:hover { background-color: #e5e7eb; color: #1f2937; }
        .form-control, .form-select { border-radius: 12px; padding: 12px; border-color: #e5e7eb; }
        .form-control:focus, .form-select:focus { border-color: #d97706; box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15); }
        .text-amber-custom { color: #d97706 !important; }

        .goog-te-banner-frame.skiptranslate { display: none !important; }
        body { top: 0px !important; }
        .goog-te-combo {
            padding: 6px 12px;
            border-radius: 9999px;
            border: 1px solid #d1d5db;
            outline: none;
            background-color: white;
            font-size: 14px;
            color: #374151;
        }
    </style>
</head>
<body>

<div class="container mb-3" style="max-width: 600px;">
    <div class="d-flex justify-content-end">
        <div id="google_translate_element"></div>
    </div>
</div>

<div class="container mt-2">
    <div class="checkout-card">
        <h3 class="text-center mb-4 fw-black flex items-center justify-center gap-2">
            <i class="fas fa-clipboard-list text-amber-custom"></i> إتمام طلب المطعم
        </h3>
        
        <!-- صندوق معلومات المنتج أو السلة -->
        <div class="card p-3 mb-3 border-0 bg-amber-50/50" id="product_info_box">
            {% if is_cart %}
                <h5>الطلب: <span class="text-amber-custom">سلة طلبات المأكولات</span></h5>
                <div id="cart_items_summary" class="mt-2 text-muted small"></div>
                <p class="mb-0 text-danger fw-bold mt-2">مجموع الوجبات: <span id="product_unit_price">0</span> دج</p>
            {% else %}
                <h5>الوجبة: <span class="text-amber-custom">{{ product.name }}</span></h5>
                <p class="mb-0 text-danger fw-bold">سعر الوجبة للقطعة: <span id="product_unit_price">{{ product.price }}</span> دج</p>
            {% endif %}
        </div>

        <form action="/submit-order" method="POST" onsubmit="prepareCartData()">
            {% if not is_cart %}
                <input type="hidden" name="product_id" value="{{ product.id }}">
            {% endif %}
            
            <!-- حقل مخفي لحمل بيانات السلة كاملة إذا كان الطلب عبارة عن سلة -->
            <input type="hidden" name="cart_data" id="cart_data_input">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">الاسم</label>
                    <input type="text" name="customer_name" class="form-control" required placeholder="أدخل الاسم">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">اللقب</label>
                    <input type="text" name="customer_last_name" class="form-control" required placeholder="أدخل اللقب">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">رقم الهاتف</label>
                <input type="tel" name="phone" class="form-control" required placeholder="0XXXXXXXXX">
            </div>

            <!-- خانة البلد -->
            <div class="mb-3">
                <label for="country" class="form-label">البلد</label>
                <select id="country" name="country" class="form-select" onchange="toggleCountryFields()" required>
                    <option value="" disabled selected>-- اختر الدولة --</option>
                    <option value="algeria">الجزائر 🇩🇿</option>
                    <option value="jordan">الأردن 🇯🇴</option>
                </select>
            </div>

            <!-- خانة الكمية -->
            <div class="mb-3" id="quantity_container">
                <label for="quantity" class="form-label">الكمية</label>
                <input type="number" id="quantity" name="quantity" class="form-control" value="1" min="1" oninput="calculateTotal()" required>
            </div>

            <!-- خانة ولايات الجزائر -->
            <div class="mb-3" id="algeria_section">
                <label class="form-label">الولاية / المدينة</label>
                <select id="wilaya" name="wilaya" class="form-select" onchange="calculateTotal()">
                    <option value="">-- اختر الولاية --</option>
                    {% for wilaya in rates %}
                        <option value="{{ wilaya.id }}" 
                                data-home="{{ wilaya.home_price }}" 
                                data-office="{{ wilaya.office_price }}">
                            {{ wilaya.wilaya_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- خانة محافظات الأردن -->
            <div class="mb-3 d-none" id="jordan_section">
                <label for="jordan_region" class="form-label">المحافظة والمنطقة (الأردن)</label>
                <select id="jordan_region" name="jordan_region" class="form-select" onchange="calculateTotal()" style="color: #000 !important; background-color: #fff !important;" required>
                    <option value="" disabled selected style="color: #000;">-- اختر المحافظة والمنطقة --</option>
                    {% for rate in jordan_rates %}
                        <option value="{{ rate.id }}" 
                                data-home="{{ rate.home_price }}" 
                                data-office="{{ rate.office_price }}"
                                style="color: #000 !important; background-color: #fff !important;">
                            {{ rate.governorate_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- حاوية خانة البلدية -->
            <div class="mb-3" id="baladiya_container">
                <label class="form-label">البلدية</label>
                <input type="text" name="baladia" id="baladiya_input" class="form-control" placeholder="أدخل اسم البلدية">
            </div>

            <div class="mb-3">
                <label class="form-label">العنوان بالتفصيل (لتوصيل الوجبة ساخنة)</label>
                <input type="text" name="address" class="form-control" placeholder="رقم الحي، الشارع، أو علامة مميزة" required>
            </div>

            <div class="mb-3" id="delivery_type_box">
                <label class="form-label">طريقة الاستلام</label>
                <select id="delivery_type" name="delivery_type" class="form-select" onchange="calculateTotal()" required>
                    <option value="home">توصيل للمنزل (دليفري)</option>
                    <option value="office">استلام من المطعم / المكتب</option>
                </select>
            </div>

            <input type="hidden" name="delivery_price" id="delivery_price_input" value="0">

            <div class="price-box">
                <h5>سعر التوصيل: <span id="shipping_display">0</span> دج</h5>
                <h4 class="text-amber-custom mt-2">المجموع الكلي: <span id="total_display">0</span> دج</h4>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn-confirm">تأكيد الطلب الآن</button>
                <a href="/shop" class="btn-back">رجوع للقائمة</a>
            </div>
        </form>
    </div>
</div>

<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'ar',
    includedLanguages: 'ar,en,fr,es',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE
  }, 'google_translate_element');
}
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script>
    let isCartOrder = "{{ 'true' if is_cart else 'false' }}" === "true";
    let basePrice = 0;

    window.addEventListener('DOMContentLoaded', () => {
        if (isCartOrder) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let summaryContainer = document.getElementById('cart_items_summary');
            let priceSpan = document.getElementById('product_unit_price');
            let quantityContainer = document.getElementById('quantity_container');
            
            if(quantityContainer) quantityContainer.style.display = 'none';
            
            if (cart.length > 0) {
                let htmlList = "<ul class='mb-0 ps-3'>";
                let cartTotal = 0;
                
                cart.forEach(item => {
                    let itemTotal = item.price * (item.quantity || 1);
                    cartTotal += itemTotal;
                    htmlList += `<li>${item.name} (الكمية: ${item.quantity || 1}) - ${itemTotal} دج</li>`;
                });
                htmlList += "</ul>";
                
                if(summaryContainer) summaryContainer.innerHTML = htmlList;
                basePrice = cartTotal;
                if(priceSpan) priceSpan.innerText = cartTotal;
            } else {
                if(summaryContainer) summaryContainer.innerHTML = "سلة المأكولات فارغة!";
                basePrice = 0;
            }
        } else {
            basePrice = parseFloat("{{ product.price if product else 0 }}");
        }
        calculateTotal();
    });

    function toggleCountryFields() {
        const country = document.getElementById('country').value;
        const algeriaSection = document.getElementById('algeria_section');
        const jordanSection = document.getElementById('jordan_section');
        const wilayaSelect = document.getElementById('wilaya');
        const jordanSelect = document.getElementById('jordan_region');
        const baladiyaContainer = document.getElementById('baladiya_container');
        const baladiyaInput = document.getElementById('baladiya_input');

        if (country === 'algeria') {
            algeriaSection.classList.remove('d-none');
            jordanSection.classList.add('d-none');
            wilayaSelect.setAttribute('required', 'required');
            jordanSelect.removeAttribute('required');
            jordanSelect.value = "";

            if (baladiyaContainer) {
                baladiyaContainer.style.display = "block";
                if (baladiyaInput) baladiyaInput.setAttribute('required', 'required');
            }
        } else if (country === 'jordan') {
            algeriaSection.classList.add('d-none');
            jordanSection.classList.remove('d-none');
            jordanSelect.setAttribute('required', 'required');
            wilayaSelect.removeAttribute('required');
            wilayaSelect.value = "";

            if (baladiyaContainer) {
                baladiyaContainer.style.display = "none";
                if (baladiyaInput) {
                    baladiyaInput.removeAttribute('required');
                    baladiyaInput.value = "";
                }
            }
        }
        calculateTotal();
    }

    function calculateTotal() {
        const country = document.getElementById('country').value;
        const shippingDisplay = document.getElementById('shipping_display');
        const totalDisplay = document.getElementById('total_display');
        const deliveryPriceInput = document.getElementById('delivery_price_input');
        
        let quantity = 1;
        if (!isCartOrder) {
            quantity = parseInt(document.getElementById('quantity').value) || 1;
        }

        let shippingPrice = 0;

        if (country === 'algeria') {
            const wilayaSelect = document.getElementById('wilaya');
            const deliveryType = document.getElementById('delivery_type').value;
            const selectedOption = wilayaSelect.options[wilayaSelect.selectedIndex];
            
            if (selectedOption && selectedOption.value !== "") {
                shippingPrice = (deliveryType === 'home') ? parseFloat(selectedOption.dataset.home || 0) : parseFloat(selectedOption.dataset.office || 0);
            }
        } else if (country === 'jordan') {
            const jordanSelect = document.getElementById('jordan_region');
            const deliveryType = document.getElementById('delivery_type').value;
            const selectedJordanOption = jordanSelect.options[jordanSelect.selectedIndex];
            
            if (selectedJordanOption && selectedJordanOption.value !== "") {
                shippingPrice = (deliveryType === 'home') ? parseFloat(selectedJordanOption.dataset.home || 0) : parseFloat(selectedJordanOption.dataset.office || 0);
            }
        }
        
        let productsTotal = isCartOrder ? basePrice : (basePrice * quantity);
        let finalTotal = productsTotal + shippingPrice;

        shippingDisplay.innerText = shippingPrice;
        totalDisplay.innerText = finalTotal;
        deliveryPriceInput.value = shippingPrice;
    }

    function prepareCartData() {
        if (isCartOrder) {
            let cart = localStorage.getItem('cart') || '[]';
            document.getElementById('cart_data_input').value = cart;
            localStorage.removeItem('cart');
        }
    }
</script>

</body>
</html>
